# track_mjx/config/latent_mimic_phase2_v8.yaml
#
# Phase 2 v8 — uses v10 prior (24-dim split-head latent + sigma curriculum).
#
# Hypotheses being tested vs v7:
#   * Body-part-split latent guarantees leg dims exist → Phase 2 r_mimic
#     can no longer be optimized by matching only torso/head (v7 failure).
#   * 24-dim total (vs v7's 60) → tighter bottleneck, sharper r_mimic
#     dynamic range, less posterior collapse.
#   * sigma_max curriculum'd from 0.3 → 0.05 means each branch's σ is
#     genuinely meaningful at the end of Phase 1 (not pinned at the wall).
#
# w_r is calibrated below for the new latent. The factor of 2.5× came from a
# small init-time r/step probe — see preflight script.

defaults:
  - rodent-full-clips
  - _self_

env_config:
  reward_terms: {}                  # paper: only r_mimic from wrapper
  njmax: 800
  termination_criteria:
    nan_termination: {}
    root_too_far:
      max_distance: 0.3
    pose_error:
      max_l2_error: 6.0
  domain_randomization:
    use_domain_randomization: false

latent_mimic:
  prior_dir: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_prior_v10/best
  # Calibrated from random-action probe: KL/step at init ≈ 700–1600.
  # exp(-2.5e-3 * 800) ≈ 0.13 — matches v7's ~0.15 init r/step which had
  # clean dynamic range and trained well. Higher than v7's w_r=3e-4
  # because v10 has 24 latent dims (vs 60) with looser σ (0.07 vs 0.05),
  # so per-dim KL contribution is ~5× smaller and we compensate.
  w_r: 2.5e-3
  history_len: 0
  n_joints: 67
  kl_mode: full

  drop_dead_orientations: true
  proprio_var_threshold: 1.0e-8

  use_predictor: true

network_config:
  arch_name: latent_mimic
  policy_layer_sizes: [512, 256, 128]
  value_layer_sizes: [512, 256, 128]

train_setup:
  agent_name: rodent
  run_name: phase2_v8_split_latent_750M
  checkpoint_to_restore: null
  restore_from_run_state: null
  train_test_split_info: null
  train_subset_ratio: 0.8
  eval_every: 25_000_000
  episode_length: 200
  reset_every: 50_000_000
  freeze_decoder: false
  train_config:
    num_envs: 1024
    num_timesteps: 750_000_000
    batch_size: 512
    num_minibatches: 8
    num_updates_per_batch: 4
    learning_rate: 1.0e-4
    lr_schedule: constant
    lr_end_value: 0.0
    lr_warmup_frac: 0.0
    clipping_epsilon: 0.2
    discounting: 0.95
    action_repeat: 1
    entropy_cost: 1.0e-2
    vf_loss_coefficient: 0.25
    reward_scaling: 1
    normalize_observations: true
    unroll_length: 10
    seed: 0
    get_activation: false
    deterministic_eval: true

logging_config:
  project_name: latent-mimic
  group_name: phase2
  exp_name: phase2_v8_split_latent_750M
  clip_id: -1
  model_path: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_phase2_v8

checkpoint_dir: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_phase2_v8
