# track_mjx/config/latent_mimic_pretrain.yaml
# Phase 1: pre-train MotionEncoder + MotionDecoder + MotionPredictor on rat mocap.

defaults:
  - _self_

# Walker / data
walker_name: rodent
n_joints: 67
reference_data_path: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/data/rodent/rodent_reference_clips.h5
clip_length: 250
keep_clips_idx: null            # null = all walking clips already filtered by env config
train_ratio: 0.8
seed: 0

# Window dims
window_len: 10                  # encoder input window w
horizon: 5                      # predictor output horizon n

# Network sizes — v3: significantly larger nets to handle 67-joint rat over 10-frame windows.
# v2 diagnostic showed posterior collapse (only 3/16 latents used) AND output collapse
# (decoder produced near-flat lines per dim). Wider/deeper nets give the decoder room to
# express temporal variation, encoder has more capacity to compress 1470-dim windows.
encoder_layer_sizes: [1024, 512, 256]
decoder_layer_sizes: [256, 512, 1024]   # build up to wide for the 1470-dim upsampling
predictor_layer_sizes: [512, 512, 256]
latent_dim: 16                   # match track-mjx intention_size convention

# Loss weights — v4: beta_kl 0.001 -> 0.02. v3 hit best val at step 8k then overfit.
# Pull beta_kl back toward (but not all the way to) v2's 0.1 to add regularization.
# Best v3 val_total was 0.577 at step 8k; final was 0.974 (overfit by 1.7x).
beta_kl: 0.02
w_pred: 1.0
beta_kl_anneal_steps: 15_000    # paced for 120k total steps

# Optimization — v4: stronger weight decay (1e-3, AdamW default) to fight overfit.
# num_steps 300k -> 120k since v3 hit best val by step 8k; 120k gives ~15x headroom.
batch_size: 32768
num_steps: 120_000
learning_rate: 3.0e-4           # peak LR
weight_decay: 1.0e-3
grad_clip: 1.0

lr_schedule: cosine             # constant | cosine
lr_warmup_frac: 0.04            # 5k warmup at 120k total
lr_hold_frac: 0.20              # 24k hold at 120k total
lr_end_value: 3.0e-5            # 10x decay over the cosine portion

# Logging / checkpointing
log_every: 500
eval_every: 2000
ckpt_dir: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_prior
ckpt_every: 10_000

# wandb
wandb_enabled: true
wandb_project: latent-mimic
wandb_run_name: null            # null = auto from hydra
wandb_tags: ["phase1", "rodent"]
wandb_group: null
viz_n_dims: 6                   # number of feature dims to overlay in recon/pred figures
viz_every: 10_000               # every N steps, log recon + prediction figures
