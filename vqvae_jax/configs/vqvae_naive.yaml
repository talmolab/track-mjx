# =============================================================================
# VQ-VAE Naive Hybrid (Continuous + Discrete) Experiment Configuration
# =============================================================================
# Tests the hybrid VQ+VAE architecture where the encoder outputs (mean, logvar),
# VQ quantizes the mean, and the sampled z_e is passed directly to the decoder
# alongside the discrete code. KL divergence regularizes the continuous latent.
# =============================================================================

# =============================================================================
# VNL Environment Configuration
# =============================================================================
env_config:
  mujoco_impl: "jax"

  # Physics Solver Settings (same as production)
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  nconmax: 256
  njmax: 128
  noslip_iterations: 0

  # Timing Configuration
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50

  # Reference Clip Settings
  clip_length: 250
  clip_set: "all"
  reference_length: 5
  start_frame_range: [0, 20]
  qvel_init: "zeros"
  keep_clips_idx: null
  balanced_split_path: /home/jovyan/vast/kaiwen/track-mjx/data/rodent/rodent_balanced_splits.json

  # Domain Randomization
  domain_randomization:
    use_domain_randomization: true
    floor_friction: [0.5, 1.0]
    static_friction_scale: [0.8, 1.2]
    armature_scale: [0.8, 1.2]
    com_jitter: [0.0, 0.005]
    link_mass_scale: [0.9, 1.1]
    torso_mass_jitter: [0.0, 0.05]
    qpos0_jitter: [0.0, 0.01]

  # Reward Terms - Same as production
  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.41
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0
    end_eff:
      exp_scale: 0.03
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # Termination Criteria
  termination_criteria:
    root_too_far:
      max_distance: 0.2
    root_too_rotated:
      max_degrees: 90.0
    pose_error:
      max_l2_error: 6.0
    nan_termination: {}

# =============================================================================
# Rendering Configuration
# =============================================================================
render_config:
  render_camera_name: close_profile
  render_fps: 50
  render_interval: 5
  render_per_code_videos: false
  eval_rollouts_for_transition: 16
  num_eval_rollout_videos: 3

# =============================================================================
# Network Architecture - Naive Hybrid VQ+VAE
# =============================================================================
network_config:
  arch_name: vqvae_naive

  # Encoder/Decoder sizes
  encoder_layer_sizes: [512, 256, 256]
  decoder_layer_sizes: [512, 512, 256, 256]
  critic_layer_sizes: [512, 512, 256, 256]

  # Latent space settings
  intention_size: 16
  latent_dim: 16                # Discrete codebook dimension

  # VQ-VAE specific settings
  num_codes: 32
  commitment_cost: 0.1
  codebook_loss_weight: 1.0
  codebook_entropy_weight: 0.1
  codebook_entropy_temperature: 1.0
  codebook_init_scale: 1.0
  stickiness_bias: [0.0, 0.0]

  # Dead code reinitialization
  dead_code_reinit: true
  dead_code_threshold: 0.01

  # Residual VQ settings - simple for naive experiment
  rvq_depth: 1
  use_rotation: false
  coupled_residual_grad: false
  proprio_noise_scale: 0.0

  # Continuous latent (hybrid VQ+VAE) - ENABLED
  use_continuous_latent: true
  continuous_latent_dim: 4          # Dimension of continuous head
  kl_weight: 0.1                    # Lower for two-head architecture

  # Code chunking (Semi-MDP temporal commitment)
  use_code_chunking: false
  code_commitment_horizon: 0

  # Disable KL schedule
  kl_schedule: false

  # VQ-VAE loss schedule
  vq_schedule: false
  vq_warmup_steps: 0
  vq_ramp_steps: 0

# =============================================================================
# Training Setup
# =============================================================================
train_setup:
  agent_name: rodent
  run_name: vqvae_naive_test

  checkpoint_to_restore: null
  restore_from_run_state: null

  train_test_split_info: null
  train_subset_ratio: 0.7

  eval_every: 20_000_000
  episode_length: 200
  reset_every: 20_000_000

  train_config:
    num_envs: 2048
    num_timesteps: 5_000_000_000
    batch_size: 512
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 1e-4
    clipping_epsilon: 0.2
    discounting: 0.95
    action_repeat: 1
    entropy_cost: 1e-2
    reward_scaling: 1
    normalize_observations: true
    unroll_length: 20
    seed: 0
    get_activation: false
    deterministic_eval: true

# =============================================================================
# Logging Configuration
# =============================================================================
logging_config:
  project_name: vqvae_experiments
  group_name: naive_hybrid
  exp_name: vqvae_naive
  clip_id: 0
  model_path: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/model_checkpoints

