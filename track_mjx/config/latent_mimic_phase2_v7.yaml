# track_mjx/config/latent_mimic_phase2_v7.yaml
#
# Phase 2 v7 — paper-faithful 750M run with full Gaussian KL.
#
# Differences from v6 (300M run, mean-mode KL):
#   - kl_mode: full (Wang 2026's actual KL formulation)
#   - w_r: 3e-4 (≈ v6's 0.05 / 400, since full KL ≈ mean KL × (1/σ²) = mean × 400)
#   - num_timesteps: 750M (track-mjx empirical convergence point for kinematic mimic)
#
# Why pure r_mimic instead of hybrid:
#   The whole point of the latent style policy is to produce a meaningful latent
#   trajectory for Phase 3 to consume. Hybrid kinematic+latent reward could let
#   the policy ignore the latent structure as long as kinematics match — bad
#   for Phase 3. We accept slower convergence in exchange for clean latent
#   structure.
#
# Why full KL instead of mean:
#   Mean-mode KL only matches posterior means. Full KL also penalizes mismatch
#   of posterior variances, which carries behavior identity (the encoder learned
#   to use σ to distinguish behavior precision). Phase 3 will benefit from a
#   style policy whose posteriors match the prior's full distribution, not just
#   the means.

defaults:
  - rodent-full-clips
  - _self_

env_config:
  reward_terms: {}
  njmax: 800
  termination_criteria:
    nan_termination: {}
    root_too_far:
      max_distance: 0.3
    pose_error:
      max_l2_error: 6.0
  domain_randomization:
    use_domain_randomization: false

latent_mimic:
  prior_dir: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_prior_v9/best
  w_r: 3.0e-4                       # see header — calibrated for full-mode KL
  history_len: 0
  n_joints: 67
  kl_mode: full                     # paper-faithful Gaussian KL

  drop_dead_orientations: true
  proprio_var_threshold: 1.0e-8

  use_predictor: true               # v9 predictor is now usable

network_config:
  arch_name: latent_mimic
  policy_layer_sizes: [512, 256, 128]
  value_layer_sizes: [512, 256, 128]

train_setup:
  agent_name: rodent
  run_name: phase2_v7_full_kl_750M
  checkpoint_to_restore: null
  restore_from_run_state: null
  train_test_split_info: null
  train_subset_ratio: 0.8
  eval_every: 25_000_000              # 30 evals over 750M
  episode_length: 200
  reset_every: 50_000_000
  freeze_decoder: false
  train_config:
    num_envs: 1024
    num_timesteps: 750_000_000
    batch_size: 512
    num_minibatches: 8
    num_updates_per_batch: 4
    learning_rate: 1.0e-4
    lr_schedule: constant
    lr_end_value: 0.0
    lr_warmup_frac: 0.0
    clipping_epsilon: 0.2
    discounting: 0.95
    action_repeat: 1
    entropy_cost: 1.0e-2
    vf_loss_coefficient: 0.25
    reward_scaling: 1
    normalize_observations: true
    unroll_length: 10
    seed: 0
    get_activation: false
    deterministic_eval: true

logging_config:
  project_name: latent-mimic
  group_name: phase2
  exp_name: phase2_v7_full_kl_750M
  clip_id: -1
  model_path: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_phase2_v7

checkpoint_dir: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_phase2_v7
