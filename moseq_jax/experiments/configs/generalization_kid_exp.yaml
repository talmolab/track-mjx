# =============================================================================
# Generalization KID Comparison: MIMIC vs C2A on Unseen Data
# =============================================================================
# Samples long segments from unseen continuous data, runs KPMS to extract
# syllable codes, then evaluates both MIMIC (oracle) and Code2Act on those
# segments. Trains a VAE on mimic-MJX oracle rollouts from training data,
# then computes KID to compare distributional quality on generalization data.
#
# Usage:
#   cd moseq_jax
#   python -m experiments.run_generalization_kid
# =============================================================================

# Unseen continuous recording
new_data:
  path: /home/jovyan/vast/kaiwen/track-mjx/data/transform_art_2020_12_22_1.h5

# KPMS model for code extraction
kpms:
  model_dir: /home/jovyan/vast/kaiwen/track-mjx/moseq_jax/outputs/kpms_sweep/s50_k1e+04_l10_arhmm/seed1
  model_name: keypoint_arhmm_states50_seed1
  num_iters: 200

# STAC model for FK
stac_xml: /home/jovyan/vast/kaiwen/TopoVNL/stac-mjx/models/rodent.xml
reference_h5: /home/jovyan/vast/kaiwen/track-mjx/data/rodent/rodent_reference_clips.h5

# Code2Act checkpoint
checkpoint:
  path: /home/jovyan/vast/kaiwen/track-mjx/moseq_jax/model_checkpoints/260407_031233_484020/
  step: null

# Mimic-MJX oracle checkpoint
mimic_checkpoint:
  path: /home/jovyan/vast/kaiwen/track-mjx/moseq_jax/trained_mimic_ckpts/260405_235031_234849/
  step: null

# Experiment parameters
K: 50                     # Total number of segments (bodies)
frames_per_segment: 2000  # Env steps per segment
seed: 42
n_render: 10              # Number of bodies to render (customizable)

# KID evaluation — inline VAE training on training data
kid_eval:
  # VAE cache directory (shared across experiments)
  vae_cache_dir: /home/jovyan/vast/kaiwen/track-mjx/moseq_jax/outputs/moseq_generalization_kid_vae_cache

  # Training data for VAE (mimic-MJX oracle rollouts on reference clips)
  reference_data_path: /home/jovyan/vast/kaiwen/track-mjx/data/rodent/rodent_reference_clips.h5
  balanced_split_path: /home/jovyan/vast/kaiwen/track-mjx/data/rodent/rodent_balanced_splits.json
  codes_path: /home/jovyan/vast/kaiwen/track-mjx/moseq_jax/outputs/kpms_sweep/best_codes.npz
  vae_training_clips: 400   # Number of mimic rollouts for VAE training
  vae_training_seed: 42

  # VAE architecture + training
  vae:
    latent_dim: 64
    hidden_layers: [512, 256]
    dropout_rate: 0.1
    use_layer_norm: true
    seeds: [0, 1, 2]
    num_epochs: 5000
    batch_size: 32
    beta: 1.0
    beta_warmup_epochs: null   # defaults to num_epochs // 2
    learning_rate: 0.001
    weight_decay: 0.00001
    grad_clip_norm: 1.0

  # Chunking: each rollout → N chunks of 250 steps (125 mocap frames)
  # 500 → 2 chunks, 1000 → 4 chunks, 2000 → 8 chunks
  chunk_control_steps: 250
  survival_threshold: 250
  steps_per_frame: 2

  # Preprocessing (applied to both VAE training data and generalization data)
  preprocessing:
    exclude_xy: true
    handle_rotation: true
    normalize_joints: true

  # KID kernel parameters
  kid:
    degree: 3
    num_subsets: 100
    subset_size: null
    split_seed: 42

output:
  base_dir: ./outputs/moseq_generalization_kid
