# Mouse forelimb (musculoskeletal arm) imitation.
#
# env_config inherits every simulation / reward / termination default from
# vnl_playground's MouseImitation task (see
# vnl_playground/tasks/mouse/{base,imitation}.py); only the backend and the
# (disabled) domain-randomization block are stated here. The network and PPO
# hyperparameters follow the MIMIC-MJX mouse-arm release checkpoint.
env_config:
  env_name: "MouseImitation"
  mujoco_impl: "jax"                  # MuJoCo backend: "jax" (MJX) or "warp"
  clip_indices: null                  # Specific clip indices to use (null = all)
  domain_randomization:
    use_domain_randomization: false   # Enable/disable domain randomization
    friction_scale: [1.0, 1.0]        # Per-env scale on floor-contact friction ([1.0,1.0]=identity)
    static_friction_scale: [0.9, 1.1] # Scale for static friction coeffs
    armature_scale: [1.0, 1.05]       # Scale for joint armature values
    com_jitter: [-0.05, 0.05]         # Center of mass position jitter (m)
    link_mass_scale: [0.9, 1.1]       # Scale for link masses
    torso_mass_jitter: [-0.02, 0.02]  # Jitter for torso mass
    qpos0_jitter: [-0.05, 0.05]       # Jitter for initial joint positions

render_config:
  render_camera_name: close-profile   # Camera view for rendering
  render_fps: 50                      # Output video framerate
  render_interval: 1                  # Render every N eval episodes

network_config:
  arch_name: intention
  encoder_layer_sizes: [512, 512, 512]   # Reference trajectory encoder
  decoder_layer_sizes: [512, 512, 512]   # Policy decoder
  critic_layer_sizes: [512, 512, 512]    # Value function
  intention_size: 4                      # Latent intention vector dimension
  kl_schedule: true                      # Anneal KL divergence weight over training
  latent_kl_weight: 1e-5                 # Weight for KL divergence to standard Gaussian prior
  latent_ar1_weight: 0.0                 # Weight for AR(1) temporal smoothness loss

train_setup:
  agent_name: mouse_arm
  run_name: vnl_mouse_arm
  checkpoint_to_restore: null         # Path to restore model weights
  restore_from_run_state: null        # Path to restore full training state
  train_test_split_info: null         # Pre-computed split (null = random)
  train_subset_ratio: 0.8             # Fraction of clips for training
  eval_every: 25_000_000              # Eval frequency (env steps)
  episode_length: 752                 # Informational; train.py derives it from clip geometry
  reset_every: 25_000_000             # JIT recompilation frequency (memory mgmt)
  train_config:
    num_envs: 2048                    # Parallel environments
    num_timesteps: 650_000_000        # Total training steps
    batch_size: 1024                  # Samples per gradient update
    num_minibatches: 8                # Minibatches per epoch
    num_updates_per_batch: 4          # Epochs per PPO update
    learning_rate: 1e-4               # Adam learning rate
    grad_clip_threshold: 20.0         # Max gradient norm for clipping
    clipping_epsilon: 0.2             # PPO clip range
    discounting: 0.95                 # Discount factor (gamma)
    action_repeat: 1                  # Actions repeated per step
    entropy_cost: 1e-3                # Entropy bonus coefficient
    vf_loss_coefficient: 0.25         # Value function loss coefficient
    reward_scaling: 1                 # Reward multiplier
    normalize_observations: true      # Running mean/std normalization
    unroll_length: 20                 # Rollout length before update
    seed: 0                           # Random seed
    get_activation: false             # Store network activations (debugging)
    deterministic_eval: true          # Use mean action during eval

logging_config:
  project_name: mimic-mjx
  group_name: mouse_arm
  exp_name: mouse-arm-baseline
  clip_id: -1                         # Clip ID for single-clip runs (-1 = all)
  model_path: model_checkpoints/
