# track_mjx/config/latent_mimic_phase2_v8b.yaml
#
# Phase 2 v8b — v8 + σ-clamp fix.
#
# v8 ran 200M steps and plateaued: σ_sim locked at 0.52 (vs v10 training σ
# of 0.07). Diagnosis: encoder inflates posterior σ on OOD policy
# trajectories, letting the policy game KL(target‖sim) via the variance
# term — produce uncertain sim windows, KL becomes small even if μ don't
# match. Episode length stuck at 250-290, KL/step plateaued at ~120.
#
# Fix: env_wrapper now clamps BOTH z_sim and z_target logvars at
# 2*log(σ_clamp) before computing KL. This caps the encoder's "uncertainty"
# at the value used during Phase 1 training (σ_max=0.05), forcing the μ
# match to be the only path to low KL.
#
# Effect on calibration: with clamp on, KL/step at random init jumps
# from ~700 (unclamped, σ-inflated) to ~5500 (clamped). Recalibrated
# w_r=5e-4 to land r/step≈0.18 at init, matching v7's calibration sweet
# spot.

defaults:
  - rodent-full-clips
  - _self_

env_config:
  reward_terms: {}
  njmax: 800
  termination_criteria:
    nan_termination: {}
    root_too_far:
      max_distance: 0.3
    pose_error:
      max_l2_error: 6.0
  domain_randomization:
    use_domain_randomization: false

latent_mimic:
  prior_dir: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_prior_v10/best
  w_r: 5.0e-4
  history_len: 0
  n_joints: 67
  kl_mode: full

  drop_dead_orientations: true
  proprio_var_threshold: 1.0e-8

  use_predictor: true

  # σ-clamp at Phase 1 training σ_max. Prevents σ-inflation gaming.
  sigma_clamp: 0.05

network_config:
  arch_name: latent_mimic
  policy_layer_sizes: [512, 256, 128]
  value_layer_sizes: [512, 256, 128]

train_setup:
  agent_name: rodent
  run_name: phase2_v8b_split_latent_sigma_clamp_750M
  checkpoint_to_restore: null
  restore_from_run_state: null
  train_test_split_info: null
  train_subset_ratio: 0.8
  eval_every: 25_000_000
  episode_length: 200
  reset_every: 50_000_000
  freeze_decoder: false
  train_config:
    num_envs: 1024
    num_timesteps: 750_000_000
    batch_size: 512
    num_minibatches: 8
    num_updates_per_batch: 4
    learning_rate: 1.0e-4
    lr_schedule: constant
    lr_end_value: 0.0
    lr_warmup_frac: 0.0
    clipping_epsilon: 0.2
    discounting: 0.95
    action_repeat: 1
    entropy_cost: 1.0e-2
    vf_loss_coefficient: 0.25
    reward_scaling: 1
    normalize_observations: true
    unroll_length: 10
    seed: 0
    get_activation: false
    deterministic_eval: true

logging_config:
  project_name: latent-mimic
  group_name: phase2
  exp_name: phase2_v8b_sigma_clamp_750M
  clip_id: -1
  model_path: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_phase2_v8b

checkpoint_dir: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_phase2_v8b
