# =============================================================================
# DMPO config for RodentImitation (Phase-1 imitation task)
# =============================================================================
# Self-contained: algorithm hyperparameters were previously inherited from
# ``rodent-dmpo.yaml`` (now moved to vnl-playground as rodent-dmpo-base.yaml
# per plan ClaudeCode_PromptHistory/2026-05-04-3-dmpo-script-split). Track-mjx
# hosts only the imitation entry, so we inline the algorithm hyperparameters
# here. env_config + walker_config were already inlined from rodent-full-clips.
#
# Acceptance criterion (Task 16 of 2026-04-28-3-dmpo-jax-linen-port plan):
# stable training for 24h on a single 5090, episode_return rises above the
# random-policy baseline.
# =============================================================================
agent: dmpo
env_name: RodentImitation
walker: rodent_no_tail_collisions
mocap_hz: 50
ctrl_dt: 0.02
mujoco_impl: warp
seed: 0
checkpoint_dir: ./checkpoints/dmpo_imitation

env_config:
  # Environment name for registry lookup
  env_name: "RodentImitation"

  # MuJoCo backend: "jax" for GPU-accelerated simulation via MJX
  mujoco_impl: "warp"

  # -----------------------------------------------------------------------------
  # Physics Solver Settings
  # -----------------------------------------------------------------------------
  # Newton solver provides better accuracy for contact-rich scenarios
  solver: "newton"
  iterations: 5           # Max solver iterations per step
  ls_iterations: 5        # Line search iterations for Newton solver
  naconmax: 24576            # Max contacts (increase if contact clipping occurs)
  njmax: 400             # Max constraint rows
  noslip_iterations: 0    # No-slip solver iterations (0 = disabled)

  # -----------------------------------------------------------------------------
  # Timing Configuration
  # -----------------------------------------------------------------------------
  sim_dt: 0.002           # Simulation timestep (500 Hz physics)
  ctrl_dt: 0.01           # Control timestep (100 Hz policy, = sim_dt * 5)
  mocap_hz: 50            # Motion capture data frequency

  # -----------------------------------------------------------------------------
  # Reference Clip Settings
  # -----------------------------------------------------------------------------
  # Controls how motion capture reference clips are sampled during training
  clip_length: 250                # Max frames per clip
  clip_set: "all"                 # Which clips to use: "all", "train", or "test"
  reference_length: 5             # Future reference frames provided to policy
  reference_stride: 1             # Stride between reference frames
  start_frame_range: [0, 50]      # Random episode start within [min, max] frames
  qvel_init: "zeros"              # Initial velocity: "zeros" or "reference"
  keep_clips_idx: null            # Specific clip indices to use (null = all)

  # -----------------------------------------------------------------------------
  # Domain Randomization Settings
  # -----------------------------------------------------------------------------
  domain_randomization:
    use_domain_randomization: true      # Enable/disable domain randomization
    floor_friction: [0.4, 1.0]          # Uniform range for floor friction
    static_friction_scale: [0.9, 1.1]   # Scale for static friction coeffs
    armature_scale: [1.0, 1.05]         # Scale for joint armature values
    com_jitter: [-0.05, 0.05]           # Center of mass position jitter (m)
    link_mass_scale: [0.9, 1.1]         # Scale for link masses
    torso_mass_jitter: [-0.02, 0.02]    # Jitter for torso mass
    qpos0_jitter: [-0.05, 0.05]         # Jitter for initial joint positions

  # -----------------------------------------------------------------------------
  # Reward Terms
  # -----------------------------------------------------------------------------
  # Imitation rewards computed as: weight * exp(-exp_scale * error)
  # Higher exp_scale = sharper penalty for deviations
  reward_terms:
    # Root (pelvis) position tracking
    root_pos:
      exp_scale: 0.035
      weight: 1.0

    # Root orientation tracking (quaternion distance)
    root_quat:
      exp_scale: 20.0
      weight: 1.0

    # Joint angle tracking
    joints:
      exp_scale: 1.41
      weight: 1.0

    # Joint velocity tracking (disabled)
    joints_vel:
      exp_scale: 1.0
      weight: 0.0

    # Body position tracking (disabled, using end effectors instead)
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0

    # End effector (feet, hands, head) position tracking
    end_eff:
      exp_scale: 0.03
      weight: 1.0

    # -------------------------------------------------------------------------
    # Regularization Costs
    # -------------------------------------------------------------------------
    # Healthy torso height range (terminates if outside)
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0

    # Penalize large control signals
    control_cost:
      weight: 0.02

    # Penalize jerky control changes between steps
    control_diff_cost:
      weight: 0.02

    # Penalize energy consumption (capped at max_value)
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # -----------------------------------------------------------------------------
  # Termination Criteria
  # -----------------------------------------------------------------------------
  # Episode ends early if any of these conditions are met
  termination_criteria:
    # Root position deviates too far from reference
    root_too_far:
      max_distance: 0.1      # meters

    # Root orientation deviates too much from reference
    root_too_rotated:
      max_degrees: 60.0

    # Overall pose error exceeds threshold
    pose_error:
      max_l2_error: 4.5

    # Terminate on NaN detection (numerical instability)
    nan_termination: {}

walker_config:
  walker_name: "rodent"
  torque_actuators: true              # Use torque (vs position) control
  rescale_factor: 0.9                 # Model scale factor

logging_config:
  project_name: dmpo-rodent-imitation
  exp_name: rodent-dmpo-imitation
  group_name: RodentImitation
  notes: "DMPO from-scratch imitation; track_mjx.train_dmpo entry"

# =============================================================================
# DMPO Training Hyperparameters (inlined from former rodent-dmpo.yaml)
# =============================================================================
# Pinned to vnl-ray's verified hyperparameters; the parity-validated MPO loss
# expects exactly these numbers. Imitation-specific overrides (num_envs,
# num_timesteps, eval cadence) are at the bottom of this block.
train_config:
  # Training loop
  unroll_length: 50

  # Replay
  batch_size: 256
  min_replay_size: 50_000
  max_replay_size: 4_000_000
  sequence_length: 50
  samples_per_insert: 2.0

  # MPO loss
  epsilon: 0.1
  epsilon_mean: 0.0025
  epsilon_stddev: 1.0e-7
  epsilon_penalty: 0.1
  init_log_temperature: 10.0
  init_log_alpha_mean: 10.0
  init_log_alpha_stddev: 1000.0
  per_dim_constraining: true
  action_penalization: true
  num_samples: 20

  # Distributional critic (C51)
  vmin: -150.0
  vmax: 150.0
  num_atoms: 51

  # Networks
  policy_layer_sizes: [256, 256, 256]
  critic_layer_sizes: [512, 512, 256]

  # Optim
  policy_lr: 1.0e-4
  critic_lr: 1.0e-4
  dual_lr: 1.0e-3
  grad_clip: 40.0

  # Targets
  target_policy_update_period: 101
  target_critic_update_period: 107

  # RL
  discount: 0.97
  n_step: 50

  # ---- Imitation-specific overrides ----
  # Imitation has tighter dynamics: smaller num_envs / shorter total budget
  # since we expect convergence well before 1B steps.
  num_envs: 1024
  num_timesteps: 500_000_000

  # Eval more often during imitation — useful for catching divergence early.
  eval_every_steps: 500_000
  log_every_steps: 5_000

  # Number of fused training iterations packed into one jax.lax.scan +
  # jit dispatch (Task 5 of 2026-05-04-2 plan).
  iters_per_chunk: 8
