# =============================================================================
# Rodent Full Clips VNL Configuration
# =============================================================================
# Configuration for training a Virtual Neuroscience Lab (VNL) rodent tracking
# agent using PPO. This config trains on the full set of motion capture clips.
# =============================================================================

# =============================================================================
# VNL Environment Configuration
# =============================================================================
# Settings for the MuJoCo simulation environment and imitation learning task.
env_config:
  # Environment name for registry lookup
  env_name: "RodentImitation"
  walker_name: "rodent"
  torque_actuators: true              # Use torque (vs position) control
  rescale_factor: 0.9                 # Model scale factor

  # MuJoCo backend: "warp" for GPU-accelerated simulation via MJX
  mujoco_impl: "warp"

  # -----------------------------------------------------------------------------
  # Physics Solver Settings
  # -----------------------------------------------------------------------------
  # Newton solver provides better accuracy for contact-rich scenarios
  solver: "newton"
  iterations: 5           # Max solver iterations per step
  ls_iterations: 5        # Line search iterations for Newton solver
  contacts_per_world: 20      # Contact capacity allocated per environment
  constraints_per_world: 600  # Constraint capacity allocated per environment
  noslip_iterations: 0    # No-slip solver iterations (0 = disabled)

  # -----------------------------------------------------------------------------
  # Timing Configuration
  # -----------------------------------------------------------------------------
  sim_dt: 0.002           # Simulation timestep (500 Hz physics)
  ctrl_dt: 0.01           # Control timestep (100 Hz policy, = sim_dt * 5)
  mocap_hz: 50            # Motion capture data frequency

  # -----------------------------------------------------------------------------
  # Reference Clip Settings
  # -----------------------------------------------------------------------------
  # Controls how motion capture reference clips are sampled during training
  clip_length: 250                # Max frames per clip
  clip_set: "all"                 # Which clips to use: "all", "train", or "test"
  reference_length: 5             # Future reference frames provided to policy
  start_frame_range: [0, 50]      # Random episode start within [min, max] frames
  qvel_init: "zeros"              # Initial velocity: "zeros" or "reference"
  clip_indices: null              # Specific clip indices to use (null = all)

  # -----------------------------------------------------------------------------
  # Domain Randomization Settings
  # -----------------------------------------------------------------------------
  domain_randomization:
    use_domain_randomization: true      # Enable/disable domain randomization
    friction_scale: [1.0, 1.0]          # Per-env scale on floor-contact friction ([1.0,1.0]=identity)
    static_friction_scale: [0.9, 1.1]   # Scale for static friction coeffs
    armature_scale: [1.0, 1.05]         # Scale for joint armature values
    com_jitter: [-0.05, 0.05]           # Center of mass position jitter (m)
    link_mass_scale: [0.9, 1.1]         # Scale for link masses
    torso_mass_jitter: [-0.02, 0.02]    # Jitter for torso mass
    qpos0_jitter: [-0.05, 0.05]         # Jitter for initial joint positions

  # -----------------------------------------------------------------------------
  # Reward Terms
  # -----------------------------------------------------------------------------
  # Imitation rewards computed as: weight * exp(-((error / exp_scale)^2) / 2)
  # Higher exp_scale = more lenient penalty for deviations
  reward_terms:
    # Root (pelvis) position tracking
    root_pos:
      exp_scale: 0.035
      weight: 1.0

    # Root orientation tracking (quaternion distance)
    root_quat:
      exp_scale: 40.0
      weight: 1.0

    # Joint angle tracking
    joints:
      exp_scale: 1.41
      weight: 1.0

    # Joint velocity tracking (disabled)
    joints_vel:
      exp_scale: 1.0
      weight: 0.0

    # Body position tracking (disabled, using end effectors instead)
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0

    # End effector (feet, hands, head) position tracking
    end_eff:
      exp_scale: 0.03
      weight: 1.0

    # -------------------------------------------------------------------------
    # Regularization Costs
    # -------------------------------------------------------------------------
    # Healthy torso height range (terminates if outside)
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0

    # Penalize large control signals
    control_cost:
      weight: 0.02

    # Penalize jerky control changes between steps
    control_diff_cost:
      weight: 0.02

    # Penalize energy consumption (capped at max_value)
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # -----------------------------------------------------------------------------
  # Termination Criteria
  # -----------------------------------------------------------------------------
  # Episode ends early if any of these conditions are met
  termination_criteria:
    # Root position deviates too far from reference
    root_too_far:
      max_distance: 0.1      # meters

    # Root orientation deviates too much from reference
    root_too_rotated:
      max_degrees: 120.0

    # Overall pose error exceeds threshold
    pose_error:
      max_l2_error: 4.5

    # Terminate on NaN detection (numerical instability)
    nan_termination: {}

# =============================================================================
# Rendering Configuration
# =============================================================================
# Settings for video rendering during evaluation
render_config:
  render_camera_name: close_profile   # Camera view for rendering
  render_fps: 50                      # Output video framerate
  render_interval: 1                  # Render every N eval episodes

# =============================================================================
# Network Architecture
# =============================================================================
# Intention-based architecture with VAE-style latent encoding
network_config:
  arch_name: intention
  encoder_layer_sizes: [1024,512,512,512,512]    # Reference trajectory encoder
  decoder_layer_sizes: [1024,1024,512]  # Policy decoder
  critic_layer_sizes: [1024,1024,1024,512]   # Value function
  intention_size: 16                   # Latent intention vector dimension
  kl_schedule: true                    # Anneal KL divergence weight over training
  latent_kl_weight: 1e-1               # Weight for KL divergence to standard Gaussian prior
  latent_ar1_weight: 0.0              # Weight for AR(1) temporal smoothness loss


# =============================================================================
# Training Setup
# =============================================================================
train_setup:
  agent_name: rodent
  run_name: vnl_debug

  # Checkpointing and restoration
  checkpoint_to_restore: null         # Path to restore model weights
  restore_from_run_state: null        # Path to restore full training state

  # Data splitting
  train_test_split_info: null         # Pre-computed split (null = random)
  train_subset_ratio: 0.8             # Fraction of clips for training

  # Evaluation and resets
  eval_every: 15_000_000              # Eval frequency (env steps)
  episode_length: 200                 # Max steps per episode
  reset_every: 30_000_000             # JIT recompilation frequency (memory mgmt)

  # ---------------------------------------------------------------------------
  # PPO Training Hyperparameters
  # ---------------------------------------------------------------------------
  train_config:
    num_envs: 2048                    # Parallel environments
    num_timesteps: 3_000_000_000      # Total training steps
    batch_size: 1024                  # Samples per gradient update
    num_minibatches: 16               # Minibatches per epoch
    num_updates_per_batch: 4          # Epochs per PPO update
    learning_rate: 1e-4               # Adam learning rate
    clipping_epsilon: 0.2             # PPO clip range
    discounting: 0.95                 # Discount factor (gamma)
    action_repeat: 1                  # Actions repeated per step
    entropy_cost: 1e-2                # Entropy bonus coefficient
    vf_loss_coefficient: 0.25          # Value function loss coefficient
    reward_scaling: 1                 # Reward multiplier
    normalize_observations: true      # Running mean/std normalization
    unroll_length: 20                 # Rollout length before update
    seed: 0                           # Random seed
    get_activation: false             # Store network activations (debugging)
    deterministic_eval: true          # Use mean action during eval

# =============================================================================
# Logging Configuration
# =============================================================================
# Weights & Biases logging settings
logging_config:
  project_name: mimic-mjx
  group_name: v1_warp
  exp_name: full_collision
  clip_id: -1                         # Clip ID for single-clip runs (-1 = all)
  model_path: model_checkpoints/
