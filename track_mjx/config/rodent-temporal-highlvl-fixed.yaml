# =============================================================================
# Rodent Temporal High-Level Fixed PPO Configuration
# =============================================================================
# Configuration for training a rodent tracking agent using temporal fixed PPO
# on top of a frozen feedforward decoder wrapped by HighLevelWrapper.
# =============================================================================

# =============================================================================
# VNL Environment Configuration
# =============================================================================
env_config:
  env_name: "RodentImitation"
  walker_name: "rodent"
  torque_actuators: true
  rescale_factor: 0.9
  mujoco_impl: "jax"

  # Physics Solver Settings
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  nconmax: 256
  naconmax: 131072
  njmax: 512
  noslip_iterations: 0

  # Timing Configuration
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50

  # Reference Clip Settings
  clip_length: 250
  clip_set: "all"
  reference_length: 16
  reference_stride: 4
  start_frame_range: [0, 50]
  qvel_init: "zeros"
  keep_clips_idx: null

  # Domain Randomization Settings
  domain_randomization:
    use_domain_randomization: true
    floor_friction: [0.4, 1.0]
    static_friction_scale: [0.9, 1.1]
    armature_scale: [1.0, 1.05]
    com_jitter: [-0.05, 0.05]
    link_mass_scale: [0.9, 1.1]
    torso_mass_jitter: [-0.02, 0.02]
    qpos0_jitter: [-0.05, 0.05]

  # Reward Terms
  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.41
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0
    end_eff:
      exp_scale: 0.03
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # Termination Criteria
  termination_criteria:
    root_too_far:
      max_distance: 0.1
    root_too_rotated:
      max_degrees: 60.0
    pose_error:
      max_l2_error: 4.5
    nan_termination: {}

# =============================================================================
# Rendering Configuration
# =============================================================================
render_config:
  render_camera_name: close_profile
  render_fps: 50
  render_interval: 1

# =============================================================================
# Network Architecture - Temporal High-Level Fixed PPO
# =============================================================================
# MLP encoder + RNN low-level policy over committed high-level latents.
network_config:
  arch_name: temporal_fixed_highlvl_ppo

  # Encoder (MLP - processes task_obs observations)
  encoder_layer_sizes: [2048, 1024, 1024]
  intention_size: 16

  # Low-level recurrent policy (processes committed high-level latent only)
  rnn_type: lstm                           # "simple", "gru", or "lstm"
  rnn_hidden_sizes: [512, 256]            # Hidden sizes per RNN layer
  macro_horizon: 16                       # Fixed latent commitment horizon
  condition_value_on_latent: true         # Condition critic on committed latent
  horizon_ramp: false                     # Optionally ramp horizon from 1 -> macro_horizon
  horizon_ramp_steps: 0                   # Number of train iterations for horizon ramp

  # Value network (MLP)
  critic_layer_sizes: [2048, 1024, 1024, 1024, 1024, 512]

  # Variational layer regularization losses
  kl_schedule: true
  latent_entropy_cost: 0.0
  latent_kl_weight: 1e-3
  latent_ar1_weight: 0

# =============================================================================
# Training Setup
# =============================================================================
train_setup:
  agent_name: rodent
  run_name: temporal_fixed_highlvl_ppo
  decoder_checkpoint_path: decoder_checkpoint
  decoder_checkpoint_step: null

  checkpoint_to_restore: null
  restore_from_run_state: null

  train_test_split_info: null
  train_subset_ratio: 0.8

  eval_every: 25_000_000
  episode_length: 200
  reset_every: 25_000_000

  # ---------------------------------------------------------------------------
  # PPO Training Hyperparameters
  # ---------------------------------------------------------------------------
  train_config:
    num_envs: 1024
    num_timesteps: 6_000_000_000
    batch_size: 256
    num_minibatches: 16
    num_updates_per_batch: 4              # Epochs per PPO update
    learning_rate: 1e-4
    grad_clip_threshold: 10.0
    clipping_epsilon: 0.2
    discounting: 0.97
    gae_lambda: 0.97
    action_repeat: 1
    entropy_cost: 1e-2
    vf_loss_coefficient: 0.25
    reward_scaling: 1
    normalize_observations: true
    unroll_length: 64
    seed: 0
    deterministic_eval: true

# =============================================================================
# Logging Configuration
# =============================================================================
logging_config:
  project_name: mimic-mjx
  group_name: temporal-highlvl-fixed-ppo
  exp_name: rodent-temporal-highlvl-fixed
  clip_id: -1
  model_path: model_checkpoints/
