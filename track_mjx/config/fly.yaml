# =============================================================================
# Fruitfly Imitation VNL Configuration
# =============================================================================
# Configuration for training a Virtual Neuroscience Lab (VNL) fruitfly tracking
# agent using PPO. This config trains on the full set of motion capture clips.
# =============================================================================

# =============================================================================
# VNL Environment Configuration
# =============================================================================
# Settings for the MuJoCo simulation environment and imitation learning task.
env_config:
  # Environment name for registry lookup
  env_name: "FruitflyImitation"
  walker_name: "fruitfly"
  torque_actuators: false
  rescale_factor: 1.0

  # MuJoCo backend: "jax" or "warp"
  mujoco_impl: "jax"

  # ---------------------------------------------------------------------------
  # Physics Solver Settings
  # ---------------------------------------------------------------------------
  solver: "cg"
  iterations: 5
  ls_iterations: 5
  naconmax: 10240
  njmax: 20
  noslip_iterations: 0

  # ---------------------------------------------------------------------------
  # Timing Configuration
  # ---------------------------------------------------------------------------
  sim_dt: 0.0002          # Simulation timestep (5000 Hz physics)
  ctrl_dt: 0.002          # Control timestep (500 Hz policy)
  mocap_hz: 500           # Motion capture data frequency

  # ---------------------------------------------------------------------------
  # Reference Clip Settings
  # ---------------------------------------------------------------------------
  clip_length: 600
  clip_set: "all"
  reference_length: 5
  start_frame_range: [0, 50]
  qvel_init: "zeros"
  keep_clips_idx: null

  # ---------------------------------------------------------------------------
  # Domain Randomization Settings
  # ---------------------------------------------------------------------------
  domain_randomization:
    use_domain_randomization: false
    floor_friction: [0.9, 1.1]
    static_friction_scale: [0.9, 1.1]
    armature_scale: [1.0, 1.05]
    com_jitter: [-0.05, 0.05]
    link_mass_scale: [0.9, 1.1]
    torso_mass_jitter: [-0.02, 0.02]
    qpos0_jitter: [-0.05, 0.05]

  # ---------------------------------------------------------------------------
  # Reward Terms
  # ---------------------------------------------------------------------------
  # Imitation rewards computed as: weight * exp(-((error / exp_scale)^2) / 2)
  # Higher exp_scale = more lenient penalty for deviations
  reward_terms:
    # Root (pelvis) position tracking
    root_pos:
      exp_scale: 0.035
      weight: 1.0

    # Root orientation tracking (quaternion distance)
    root_quat:
      exp_scale: 20.0
      weight: 1.0

    # Joint angle tracking
    joints:
      exp_scale: 1.41
      weight: 1.0

    # Joint velocity tracking (disabled)
    joints_vel:
      exp_scale: 1.0
      weight: 0.0

    # Body position tracking (disabled, using end effectors instead)
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0 

    # End effector (feet, hands, head) position tracking
    end_eff:
      exp_scale: 0.5
      weight: 1.0

    # -------------------------------------------------------------------------
    # Regularization Costs
    # -------------------------------------------------------------------------
    # Healthy thorax height range (terminates if outside, floor is -0.13)
    thorax_z_range:
      healthy_z_range: [-0.11, 0.1]
      weight: 1.0

    # Penalize large control signals
    control_cost:
      weight: 0.02

    # Penalize jerky control changes between steps
    control_diff_cost:
      weight: 0.02

    # Penalize energy consumption (capped at max_value)
    energy_cost:
      max_value: 50.0
      weight: 0.005

  # ---------------------------------------------------------------------------
  # Termination Criteria
  # ---------------------------------------------------------------------------
  # Episode ends early if any of these conditions are met
  termination_criteria:
    # Root position deviates too far from reference
    root_too_far:
      max_distance: 0.1

    # Root orientation deviates too much from reference
    root_too_rotated:
      max_degrees: 15       

    # Overall pose error exceeds threshold
    pose_error:
      max_l2_error: 20
    # Terminate on NaN detection (numerical instability)
    nan_termination: {}

# =============================================================================
# Rendering Configuration
# =============================================================================
# Settings for video rendering during evaluation
render_config:
  render_camera_name: track1
  render_fps: 50
  render_interval: 1

# =============================================================================
# Network Architecture
# =============================================================================
# Intention-based architecture with VAE-style latent encoding
network_config:
  arch_name: intention
  encoder_layer_sizes: [1024, 512, 512, 256]
  decoder_layer_sizes: [512, 512, 512, 256]
  critic_layer_sizes: [512,512,512,512]
  intention_size: 60
  kl_schedule: true
  latent_kl_weight: 3e-2
  latent_ar1_weight: 0

# =============================================================================
# Training Setup
# =============================================================================
train_setup:
  agent_name: fruitfly
  run_name: vnl_fruitfly

  # Checkpointing and restoration
  checkpoint_to_restore: null
  restore_from_run_state: null

  # Data splitting
  train_test_split_info: null
  train_subset_ratio: 0.8

  # Evaluation and resets
  eval_every: 10_000_000
  episode_length: 600
  reset_every: 20_000_000

  # ---------------------------------------------------------------------------
  # PPO Training Hyperparameters
  # ---------------------------------------------------------------------------
  train_config:
    num_envs: 2048
    num_timesteps: 2_000_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 1e-4
    grad_clip_threshold: 20.0
    clipping_epsilon: 0.2
    discounting: 0.95
    action_repeat: 1
    entropy_cost: 1e-2
    vf_loss_coefficient: 0.25
    reward_scaling: 1
    normalize_observations: true
    unroll_length: 20
    seed: 0
    get_activation: false
    deterministic_eval: true

# =============================================================================
# Logging Configuration
# =============================================================================
# Weights & Biases logging settings
logging_config:
  project_name: mimic-mjx
  group_name: fruitfly
  exp_name: fly-update-config
  clip_id: -1
  model_path: model_checkpoints/
