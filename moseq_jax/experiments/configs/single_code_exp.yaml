# =============================================================================
# Single-Code Sustain Grid Experiment
# =============================================================================
# For each KPMS code (ordered by popularity), sustains it for K frames
# with two body instantiations (low-z / high-z). Outputs a grid video.
# =============================================================================

checkpoint:
  path: /home/jovyan/vast/kaiwen/track-mjx/moseq_jax/model_checkpoints/260407_031233_484020/
  step: null

data:
  codes_path: /home/jovyan/vast/kaiwen/track-mjx/moseq_jax/outputs/kpms_sweep/best_codes.npz
  balanced_split_path: /home/jovyan/vast/kaiwen/track-mjx/data/rodent/rodent_balanced_splits.json
  reference_data_path: /home/jovyan/vast/kaiwen/track-mjx/data/rodent/rodent_reference_clips.h5

# Experiment parameters
sustain_frames: 100
grid_columns: 5
grid_rows_per_video: 5    # 5 rows per video (25 codes each → 2 videos for 50 codes)
seed: 42

rendering:
  panel_width: 240
  panel_height: 240
  fps: 50
  camera_distance: 0.45
  camera_elevation: -20.0
  camera_azimuth: 180.0   # frontal view (not sided)
  camera_fovy: 45.0

output:
  base_dir: ./outputs/moseq_single_code

env_config:
  mujoco_impl: "jax"
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  nconmax: 256
  njmax: 128
  noslip_iterations: 0
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50
  clip_length: 250
  clip_set: "all"
  reference_length: 5
  start_frame_range: [0, 0]
  qvel_init: "zeros"
  keep_clips_idx: null
  domain_randomization:
    use_domain_randomization: false
    floor_friction: [0.7, 0.7]
    static_friction_scale: [1.0, 1.0]
    armature_scale: [1.0, 1.0]
    com_jitter: [0.0, 0.0]
    link_mass_scale: [1.0, 1.0]
    torso_mass_jitter: [0.0, 0.0]
    qpos0_jitter: [0.0, 0.0]
  reward_terms:
    root_pos: {exp_scale: 0.035, weight: 1.0}
    root_quat: {exp_scale: 20.0, weight: 1.0}
    joints: {exp_scale: 1.41, weight: 1.0}
    joints_vel: {exp_scale: 1.0, weight: 0.5}
    bodies_pos: {exp_scale: 0.25, weight: 0.0}
    end_eff: {exp_scale: 0.03, weight: 1.0}
    torso_z_range: {healthy_z_range: [0.0325, 0.5], weight: 1.0}
    control_cost: {weight: 0.02}
    control_diff_cost: {weight: 0.02}
    energy_cost: {max_value: 50.0, weight: 0.01}
  termination_criteria:
    root_too_far: {max_distance: 0.2}
    root_too_rotated: {max_degrees: 90.0}
    pose_error: {max_l2_error: 6.0}
    nan_termination: {}

walker_config:
  walker_name: "rodent"
  torque_actuators: true
  rescale_factor: 0.9
