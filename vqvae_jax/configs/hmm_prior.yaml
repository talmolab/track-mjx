# =============================================================================
# HMM Prior: Fit + Free-Loop Generative Pipeline
# =============================================================================
# Fits a discrete HMM on D0 code sequences from rollout data,
# then generates free-loop behavior using the decoder only (no encoder).
# =============================================================================

# =============================================================================
# Checkpoint Configuration
# =============================================================================
checkpoint:
  path: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/model_checkpoints/260312_081359_853010/
  step: null  # null = latest step

# =============================================================================
# Data Configuration
# =============================================================================
data:
  h5_path_test: ./outputs/rollout_vqvae_rvq_test.h5
  analysis_split: "test"
  clip_length: 500

# =============================================================================
# HMM Configuration
# =============================================================================
hmm:
  num_states_sweep: [4, 8, 16, 32]
  num_em_iters: 200
  train_ratio: 0.8        # 80% clips for fitting, 20% for model selection
  seed: 0

# =============================================================================
# Free-Loop Rollout Configuration
# =============================================================================
free_loop:
  commitment_horizon: 10  # H: each HMM code held for H sim steps
  max_steps: 5000         # total sim steps per rollout
  seed: 42
  temperatures: [0.1, 0.5, 1.0, 2.0]  # emission temperature sweep

# =============================================================================
# Control Experiments Configuration
# =============================================================================
controls:
  random_null:
    enabled: true
    num_seeds: 5          # rollouts per condition per pose
    max_steps: 5000       # same as free_loop
  transition_analysis:
    enabled: true
    sparsity_threshold: 0.01

# =============================================================================
# WandB Configuration
# =============================================================================
wandb:
  enabled: true
  project: "vqvae-eval"
  entity: null

# =============================================================================
# Rendering Configuration
# =============================================================================
render:
  enabled: true
  camera: close_profile
  fps: 50
  width: 640
  height: 480

# =============================================================================
# Output Configuration
# =============================================================================
output:
  base_dir: ./outputs/hmm_prior

# =============================================================================
# Environment Configuration
# =============================================================================
env_config:
  env_name: "RodentImitation"
  mujoco_impl: "jax"

  # Physics Solver Settings
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  nconmax: 256
  njmax: 128
  noslip_iterations: 0

  # Timing Configuration
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50

  # Reference Clip Settings
  clip_length: 250
  clip_set: "all"
  reference_length: 5
  start_frame_range: [0, 50]
  qvel_init: "zeros"
  keep_clips_idx: null

  # Domain Randomization (disabled)
  domain_randomization:
    use_domain_randomization: false
    floor_friction: [0.7, 0.7]
    static_friction_scale: [1.0, 1.0]
    armature_scale: [1.0, 1.0]
    com_jitter: [0.0, 0.0]
    link_mass_scale: [1.0, 1.0]
    torso_mass_jitter: [0.0, 0.0]
    qpos0_jitter: [0.0, 0.0]

  # Reward Terms
  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.41
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0
    end_eff:
      exp_scale: 0.03
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # Termination Criteria
  termination_criteria:
    root_too_far:
      max_distance: 0.15
    root_too_rotated:
      max_degrees: 75.0
    pose_error:
      max_l2_error: 5.0
    nan_termination: {}

# =============================================================================
# Walker Configuration
# =============================================================================
walker_config:
  walker_name: "rodent"
  torque_actuators: true
  rescale_factor: 0.9

  joint_names:
    - vertebra_1_extend
    - hip_L_supinate
    - hip_L_abduct
    - hip_L_extend
    - knee_L
    - ankle_L
    - toe_L
    - hip_R_supinate
    - hip_R_abduct
    - hip_R_extend
    - knee_R
    - ankle_R
    - toe_R
    - vertebra_C11_extend
    - vertebra_cervical_1_bend
    - vertebra_axis_twist
    - atlas
    - mandible
    - scapula_L_supinate
    - scapula_L_abduct
    - scapula_L_extend
    - shoulder_L
    - shoulder_sup_L
    - elbow_L
    - wrist_L
    - scapula_R_supinate
    - scapula_R_abduct
    - scapula_R_extend
    - shoulder_R
    - shoulder_sup_R
    - elbow_R
    - wrist_R
    - finger_R

  body_names:
    - torso
    - pelvis
    - upper_leg_L
    - lower_leg_L
    - foot_L
    - upper_leg_R
    - lower_leg_R
    - foot_R
    - skull
    - jaw
    - scapula_L
    - upper_arm_L
    - lower_arm_L
    - finger_L
    - scapula_R
    - upper_arm_R
    - lower_arm_R
    - finger_R

  end_eff_names:
    - foot_L
    - foot_R
    - hand_L
    - hand_R
    - skull
