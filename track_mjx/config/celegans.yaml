# =============================================================================
# C. elegans Imitation VNL Configuration
# =============================================================================
# Configuration for training a Virtual Neuroscience Lab (VNL) C. elegans
# tracking agent using PPO. Trains a worm body to imitate reference motion.
# =============================================================================

# defaults:
#   - override hydra/launcher: submitit_slurm

# =============================================================================
# Rendering Configuration
# =============================================================================
# Settings for video rendering during evaluation
render_config:
  render_camera_name: track           # Camera view for rendering
  render_fps: 20                      # Output video framerate
  render_interval: 1                  # Render every N eval episodes

# =============================================================================
# VNL Environment Configuration
# =============================================================================
# Settings for the MuJoCo simulation environment and imitation learning task.
env_config:
  # Environment name for registry lookup
  env_name: WormImitation
  clip_length: 250                    # Max frames per clip
  torque_actuators: False             # Use torque (vs muscle) control
  rescale_factor: 1.001               # Model scale factor
  dim: 2                              # Spatial dimensionality of worm motion
  trans_joint: "slide"                # Root translational joint type
  contact_geom: "capsule"             # Geom type used for body contacts

  # ---------------------------------------------------------------------------
  # Contact Friction Settings
  # ---------------------------------------------------------------------------
  friction:
    tan_floor: 0.2                    # Tangential friction with floor
    tan_body: 0.9                     # Tangential friction between body segments
    tor: 0.005                        # Torsional friction
    roll_floor: 0.0001                # Rolling friction with floor
    roll_body: 0.0001                 # Rolling friction between body segments

  # ---------------------------------------------------------------------------
  # Soft Contact (solimp) Parameters
  # ---------------------------------------------------------------------------
  # Controls constraint softness for contact dynamics
  solimp:
    d0: 0.0                           # Initial impedance
    dwidth: 0.95                      # Width of impedance ramp
    width: 0.001                      # Constraint width
    midpoint: 0.5                     # Midpoint of impedance curve
    power: 2                          # Power of impedance interpolation
  impratio: 0.1                       # Friction-to-normal impedance ratio

  # ---------------------------------------------------------------------------
  # Muscle Actuator Configuration
  # ---------------------------------------------------------------------------
  muscle_config:
    gear: 1.01                        # Muscle gear ratio
    dynprm:
      tausmooth: 0.4                  # Activation smoothing time constant
    gainprm:
      force: -1                       # Max muscle force

  # ---------------------------------------------------------------------------
  # Joint Configuration
  # ---------------------------------------------------------------------------
  joint_config:
    hinge:
      damping: 0.00001                # Hinge joint damping coefficient
      armature: 1e-6                  # Hinge joint armature (rotor inertia)

  proprioceptive_filter: []           # Names of proprioceptive obs to filter out
  root_body: torso13_body             # Root body name (middle of worm)
  end_effectors: ["torso1_body", "torso25_body"]  # Head and tail bodies

  # ---------------------------------------------------------------------------
  # Physics Solver Settings
  # ---------------------------------------------------------------------------
  solver: "cg"                        # Conjugate gradient solver
  integrator: "rk4"                   # Runge-Kutta 4 integrator
  iterations: 4                       # Max solver iterations per step
  ls_iterations: 4                    # Line search iterations

  # ---------------------------------------------------------------------------
  # Timing Configuration
  # ---------------------------------------------------------------------------
  ctrl_dt: 0.1                        # Control timestep (10 Hz policy)
  sim_dt: 0.01                        # Simulation timestep (100 Hz physics)
  mocap_hz: 20                        # Motion capture data frequency

  # ---------------------------------------------------------------------------
  # Reference Clip Settings
  # ---------------------------------------------------------------------------
  reference_length: 5                 # Future reference frames provided to policy
  start_frame_range: [0, 50]          # Random episode start within [min, max] frames
  mujoco_impl: jax                    # MuJoCo backend: "jax" for GPU via MJX

  # ---------------------------------------------------------------------------
  # Initial Position
  # ---------------------------------------------------------------------------
  init_pos:
    x: 0.0
    y: 0.0
    z: 5e-3

  # ---------------------------------------------------------------------------
  # Reward Terms
  # ---------------------------------------------------------------------------
  # Imitation rewards computed as: weight * exp(-((error / exp_scale)^2) / 2)
  # Higher exp_scale = more lenient penalty for deviations
  reward_terms:
    # Upright posture reward (disabled)
    upright:
      healthy_z_range: [0.0, 1.0]
      weight: 0.0

    # Root position tracking
    root_pos:
      exp_scale: 0.01
      weight: 1.0

    # Root orientation tracking (quaternion distance)
    root_quat:
      exp_scale: 60
      weight: 1.0

    # Joint angle tracking
    joints:
      exp_scale: 1.0
      weight: 2.0 #2.0

    # Joint velocity tracking (disabled)
    joints_vel:
      exp_scale: 1.0
      weight: 0.0 #3.0

    # Body position tracking (disabled, using end effectors instead)
    bodies_pos:
      exp_scale: 0.05
      weight: 0.0

    # End effector (head, tail) position tracking
    end_eff:
      exp_scale: 0.01
      weight: 1.0

  # ---------------------------------------------------------------------------
  # Regularization Costs
  # ---------------------------------------------------------------------------
  cost_terms:
    # Penalize large control signals
    control:
      weight: 0.02

    # Penalize jerky control changes between steps
    control_diff:
      weight: 1.0

    # Penalize energy consumption (capped at max_value, disabled)
    energy:
      max_value: 50.0
      weight: 0.0

  # ---------------------------------------------------------------------------
  # Domain Randomization Settings
  # ---------------------------------------------------------------------------
  domain_randomization:
    use_domain_randomization: False   # Enable/disable domain randomization

  # ---------------------------------------------------------------------------
  # Termination Criteria
  # ---------------------------------------------------------------------------
  # Episode ends early if any of these conditions are met
  termination_criteria:
    # Worm out of healthy vertical range
    fall:
      healthy_z_range: [-1.0, 1.0]

    # Root position deviates too far from reference
    root_too_far:
      max_distance: 0.01              # meters

    # Root orientation deviates too much from reference
    root_too_rotated:
      max_degrees: 120.0

    # Overall pose error exceeds threshold
    pose_error:
      max_l2_error: 4.5

# =============================================================================
# Network Architecture
# =============================================================================
# Intention-based architecture with VAE-style latent encoding
network_config:
  arch_name: intention
  action_distribution: sigmoid              # Action distribution type
  encoder_layer_sizes: [512,512,512]        # Reference trajectory encoder
  decoder_layer_sizes: [512,512,512]        # Policy decoder
  critic_layer_sizes: [512,512,512]         # Value function
  intention_size: 8                         # Latent intention vector dimension
  kl_schedule: True                         # Anneal KL divergence weight over training
  latent_kl_weight: 1e-4                    # Weight for KL divergence to standard Gaussian prior
  latent_ar1_weight: 0.0                    # Weight for AR(1) temporal smoothness loss
  hidden_state_size: 512                    # Recurrent hidden state dimension
  hidden_layer_num: 3                       # Number of recurrent layers

# =============================================================================
# Training Setup
# =============================================================================
train_setup:
  agent_name: celegans
  run_name: imitation_init_run

  # Checkpointing and restoration
  restore_from_run_state:             # Path to restore full training state
  checkpoint_to_restore:              # Path to restore model weights

  # Data splitting
  train_test_split_info: # "data/train_test_split_rodent.json" # Path to the train/test split file, records the index
  # Ratio of training data of the whole training dataset. Needs to be in the train_test_split_info["train_subset"] key.
  # If not, please run the `notebooks/sample_efficiency_dev.ipynb` notebook to generate the train/test split file.
  train_subset_ratio: 0.8

  # Evaluation and resets
  eval_every: 50_000_000              # Eval frequency (env steps)
  episode_length: 200                 # Max steps per episode
  reset_every: 50_000_000             # JIT recompilation frequency (memory mgmt)
  freeze_decoder: False               # Freeze decoder weights during training

  # ---------------------------------------------------------------------------
  # PPO Training Hyperparameters
  # ---------------------------------------------------------------------------
  train_config:
    num_envs: 8192                    # Parallel environments
    num_timesteps: 1_500_000_000      # Total training steps
    batch_size: 1024                  # Samples per gradient update
    num_minibatches: 16               # Minibatches per epoch
    num_updates_per_batch: 4          # Epochs per PPO update
    learning_rate: 1e-4               # Adam learning rate
    clipping_epsilon: 0.2             # PPO clip range
    discounting: 0.95                 # Discount factor (gamma)
    action_repeat: 1                  # Actions repeated per step
    entropy_cost: 2e-3                # Entropy bonus coefficient
    reward_scaling: 1                 # Reward multiplier
    normalize_observations: True      # Running mean/std normalization
    unroll_length: 20                 # Rollout length before update
    seed: 0                           # Random seed
    get_activation: False             # Store network activations (debugging)
    deterministic_eval: True          # Use mean action during eval

# =============================================================================
# Logging Configuration
# =============================================================================
# Weights & Biases logging settings
logging_config:
  project_name: mimic-mjx
  group_name:
  model_path: model_checkpoints
  notes: "run c.elegans imitation baseline"
  exp_name: celegans_baseline

  # Per-rollout metrics logged to W&B
  rollout_metrics:
    - rewards/root_pos
    - rewards/root_quat
    - rewards/joints
    - rewards/joints_vel
    - rewards/bodies_pos
    - rewards/end_eff
    - rewards/upright
    - costs/control
    - costs/control_diff
    - costs/energy
    - terminations/fall
    - terminations/root_too_far
    - terminations/pose_error
    - terminations/root_too_rotated
    - distances/root_pos
    - distances/root_quat
    - distances/joints
    - distances/joints_vel
    - distances/bodies_pos
    - distances/end_eff
    - magnitudes/control
    - magnitudes/control_diff
    - magnitudes/energy
