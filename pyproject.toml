[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "track-mjx"
authors = [
    {name = "Charles Zhang", email = "charleszhang@fas.harvard.edu"},
    {name = "Scott Yang", email = "scyang@salk.com"},
    {name = "Aidan Sirbu", email = "aidan.sirbu@mail.mcgill.ca"},
    {name = "Talmo Pereira", email = "talmo@salk.edu"}]
description=  "Track-MJX: A Python package for fast reinforcement learning-based imitation learning tracking for agents"
requires-python = ">=3.12,<3.13"
keywords = ["tracking", "imitation learning", "deep learning"]
license = "BSD-3-Clause"
classifiers = [
    "Programming Language :: Python :: 3.12"]
dependencies = [
    "jax==0.10.2",
    "jaxlib==0.10.2",
    "brax @ git+https://github.com/google/brax.git@303d89dfac42919e5fde7c91f24c28a505373b24",
    "flax==0.12.7",
    "optax==0.2.8",
    "orbax-checkpoint==0.12.0",
    "mujoco==3.11.0",
    "mujoco-mjx[warp]==3.11.0",
    "PyOpenGL==3.1.9",
    "numpy==2.1.3",
    "h5py==3.12.1",
    "numba==0.61.0",
    "scikit-learn==1.7.2",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "pandas==3.0.3",
    "mediapy==1.2.2",
    "imageio[ffmpeg]==2.37.0",
    "hydra-core==1.3.2",
    "wandb==0.28.0",
    "huggingface-hub==1.20.1",
    "jaxtyping>=0.2.34",
    "playground @ git+https://github.com/google-deepmind/mujoco_playground.git@b63fcb5db02a0f27aaf2b29ce6fc14c75489fa16",
    "ipykernel",
    "vnl-playground @ git+https://github.com/talmolab/vnl-playground.git@v0.0.14",
]

dynamic = ["version", "readme"]

[tool.setuptools.dynamic]
version = {attr = "track_mjx.version.__version__"}
readme = {file = ["README.md"], content-type="text/markdown"}

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.10.2 ; sys_platform == 'linux'"]
cuda13 = ["jax[cuda13]==0.10.2 ; sys_platform == 'linux'"]
typecheck = ["beartype>=0.19"]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-watch",
    "ruff>=0.11",
    "beartype>=0.19",
    "toml",
    "twine",
    "build",
    "mkdocs-material[imaging]",
    "mkdocs-jupyter",
    "mkdocstrings[python]>=0.18",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "mike",
    ]

[project.urls]
Repository = "https://github.com/talmolab/track-mjx"

[tool.setuptools.packages.find]
include = ["track_mjx*"]

[tool.setuptools.package-data]
track_mjx = ["py.typed", "config/*.yaml"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade (modernize syntax for target Python)
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking (move imports behind TYPE_CHECKING)
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",    # line too long (formatter handles this)
    "B008",    # function call in default arg (safe for functools.partial & initializers)
    "B905",    # zip() without strict= (too noisy for JAX code)
    "RUF059",  # unused unpacked variable (common in ML: train_fn returns are optional)
]

[tool.ruff.lint.per-file-ignores]
"scripts/train*.py" = ["E402"]  # env vars must be set before GPU library imports

[tool.ruff.lint.isort]
known-first-party = ["track_mjx"]

[tool.uv]
no-sources-package = ["mujoco", "mujoco-mjx"]

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
]
