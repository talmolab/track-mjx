# =============================================================================
# Rodent Run-Gap Vision Configuration
# =============================================================================
# Configuration for training a vision-guided rodent to run through a corridor
# with gaps using VisionIntentionNetwork with egocentric camera observations.
#
# This config uses the RunGapVision environment from vnl-playground which
# provides mujoco_warp-based egocentric rendering.
# =============================================================================

# =============================================================================
# VNL Environment Configuration
# =============================================================================
# Settings for the MuJoCo simulation environment and gap-running task.
env_config:
  # Environment name for registry lookup
  env_name: "RodentRunGapVision"

  # MuJoCo backend: "warp" required for mujoco_warp GPU rendering
  mujoco_impl: "warp"

  # ---------------------------------------------------------------------------
  # Physics Solver Settings
  # ---------------------------------------------------------------------------
  solver: "newton"
  iterations: 5           # Max solver iterations per step
  ls_iterations: 5        # Line search iterations for Newton solver
  noslip_iterations: 0    # No-slip solver iterations (0 = disabled)

  # ---------------------------------------------------------------------------
  # Timing Configuration
  # ---------------------------------------------------------------------------
  sim_dt: 0.002           # Simulation timestep (500 Hz physics)
  ctrl_dt: 0.02           # Control timestep (50 Hz policy, = sim_dt * 10)

  # ---------------------------------------------------------------------------
  # Vision Settings
  # ---------------------------------------------------------------------------
  vision: true
  vision_width: 64        # Egocentric camera width in pixels
  vision_height: 64       # Egocentric camera height in pixels

  # ---------------------------------------------------------------------------
  # Corridor Settings
  # ---------------------------------------------------------------------------
  corridor_length: 4.0              # Total corridor length (meters)
  n_platforms: 10                   # Number of platforms after start platform
  platform_length_range: [0.3, 0.6] # Uniform range for platform lengths (m)
  gap_length_range: [0.03, 0.12]    # Uniform range for gap widths (m)
  target_speed: 0.3                 # Target forward velocity (m/s)
  episode_length: 2000              # Maximum episode length in physics steps

  # ---------------------------------------------------------------------------
  # Reward Terms
  # ---------------------------------------------------------------------------
  reward_terms:
    # Reward for maintaining target forward velocity
    forward_velocity:
      weight: 1.0

    # Penalty for lateral (y-direction) velocity
    lateral_velocity:
      weight: -0.1

    # Constant alive bonus per step
    alive:
      weight: 0.1

  # ---------------------------------------------------------------------------
  # Termination Criteria
  # ---------------------------------------------------------------------------
  termination_criteria:
    # Terminate if torso falls below z threshold or tilts too much
    fallen:
      min_torso_z: -0.05
      max_torso_angle: 70

    # Terminate on NaN detection (numerical instability)
    nan_termination: {}

# =============================================================================
# Network Architecture
# =============================================================================
# Vision-augmented intention-based architecture with CNN encoder branch
network_config:
  arch_name: vision_intention
  encoder_layer_sizes: [512, 512, 256]    # Trajectory+vision feature encoder
  decoder_layer_sizes: [512, 512, 256]    # Policy decoder
  critic_layer_sizes: [512, 512, 256, 256]  # Value function
  intention_size: 16                      # Latent intention vector dimension
  vision_feature_size: 128                # CNN output feature dimension
  vision_channels: [32, 64, 64]           # Conv layer channel sizes
  kl_schedule: true                       # Anneal KL divergence weight
  latent_kl_weight: 1e-2                  # KL divergence to N(0,1) prior
  latent_ar1_weight: 0.0                  # AR(1) temporal smoothness (disabled)

# =============================================================================
# Training Setup
# =============================================================================
train_setup:
  agent_name: rodent_vision
  run_name: run_gap_vision_v1

  # Checkpointing and restoration
  checkpoint_to_restore: null         # Path to restore model weights
  restore_from_run_state: null        # Path to restore full training state

  # Data splitting
  train_subset_ratio: 1.0             # Use all data (no train/test split)

  # Evaluation and resets
  eval_every: 10_000_000              # Eval frequency (env steps)
  episode_length: 200                 # Max steps per episode (policy steps)
  reset_every: 25_000_000             # JIT recompilation frequency (memory mgmt)

  # ---------------------------------------------------------------------------
  # PPO Training Hyperparameters
  # ---------------------------------------------------------------------------
  train_config:
    num_envs: 1024                    # Parallel environments
    num_timesteps: 500_000_000        # Total training steps
    batch_size: 512                   # Samples per gradient update
    num_minibatches: 8                # Minibatches per epoch
    num_updates_per_batch: 4          # Epochs per PPO update
    learning_rate: 3e-4               # Adam learning rate
    grad_clip_threshold: 10.0         # Max gradient norm for clipping
    clipping_epsilon: 0.2             # PPO clip range
    discounting: 0.97                 # Discount factor (gamma)
    action_repeat: 1                  # Actions repeated per step
    entropy_cost: 1e-2                # Entropy bonus coefficient
    vf_loss_coefficient: 0.5          # Value function loss coefficient
    reward_scaling: 1                 # Reward multiplier
    normalize_observations: true      # Running mean/std normalization
    unroll_length: 20                 # Rollout length before update
    seed: 0                           # Random seed

# =============================================================================
# Logging Configuration
# =============================================================================
# Weights & Biases logging settings
logging_config:
  project_name: vnl-vision
  group_name: run-gap
  exp_name: vision-v1
  model_path: model_checkpoints/
