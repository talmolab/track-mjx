# track_mjx/config/latent_mimic_pretrain_v12.yaml
# Phase 1 v12 — same anti-overfit recipe as v11, but with qvel features turned on.
#
# Motivation: v11 linear probe showed root_pos is recoverable from z (R² 0.89)
# but contributes weakly to z-space geometry (corr(||Δz||, ||Δroot_pos||) = 0.11).
# Phase 2 r_mimic = exp(-w_r·KL(z_target‖z_sim)) is dominated by joint differences;
# the policy tracks gait but drifts on global displacement.
#
# Hypothesis: turning on qvel adds 6 root velocity dims + 38 joint velocity dims.
# Velocities are stationary and locally-bounded (unlike absolute root_pos which
# drifts), so the encoder will spend real latent capacity on them. KL between
# trajectories then strongly penalizes velocity mismatch → policy must move at
# the right speed/direction → root_pos tracks as a *consequence* of velocity
# tracking. This is the paper's full m_t = (p, θ, v, q, q̇) formulation.
#
# Probe results (2026-04-27 evening):
#   * Joint vel active set IDENTICAL to qpos active set (38/67) — zero divergence,
#     can reuse the existing active_joints mask for qvel joint dims.
#   * All 6 root vel dims are active. Linear vel std ≈ 0.5–1.0; angular vel std
#     ≈ 8–9 (10× larger). Per-dim normalizer handles the scale gap.
#   * Angular vel max is ~143 rad/s — a few outliers post-norm; not blocking.
#
# Feat layout with use_qvel=True and 38 active joints:
#   [root_pos(3), root_quat(4), root_vel(6),
#    q_active(38), qdot_active(38)]  =  89 dims (vs v11's 45)
#
# Per-branch (via updated feat_indices_for_groups):
#   * axial: root_pos(7) + root_vel(6) + axial_joint_pos(14) + axial_joint_vel(14) = 41 in
#   * limb:  limb_joint_pos(24) + limb_joint_vel(24)                                = 48 in
# Latent dims unchanged at 12 + 12 = 24.

defaults:
  - _self_

# Walker / data (same as v11 except use_qvel)
walker_name: rodent
n_joints: 67
reference_data_path: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/data/rodent/rodent_reference_clips.h5
clip_length: 250
keep_clips_idx: null
train_ratio: 0.8
seed: 0
use_qvel: true                            # v11 was false — main change

# Active-joint detection (same as v11; reused as qvel joint mask)
auto_detect_active_joints: true
active_joint_std_thresh: 1.0e-3

# Body-part split heads (same as v11; updated feat_indices for qvel)
split_body_groups: true
split_body_groups_xml: ${oc.env:HOME}/Desktop/SalkResearch/vnl-playground/vnl_playground/tasks/rodent/xmls/rodent_full_collisions.xml
split_branch_latent_dims: [12, 12]

# Window dims (same as v11)
window_len: 10
horizon: 5

# Network architecture (same as v11; encoder absorbs the 2× larger feat_dim
# only at the conv1d input layer — net param growth ≈ 10–15% over v11)
encoder_type: conv1d
conv_channels: [64, 128, 256]
conv_kernel_size: 3
conv_head_layers: [256]
encoder_layer_sizes: [1024, 512, 256]
decoder_layer_sizes: [256, 256, 256]
predictor_layer_sizes: [384, 256]
latent_dim: 24

# Loss weights / regularization (same as v11)
beta_kl: 0.005
w_pred: 0.3
beta_kl_anneal_steps: 5_000

# sigma_max curriculum (same as v11)
sigma_max_start: 0.3
sigma_max_end: 0.10
sigma_max_anneal_frac: 0.5
sigma_max: 0.10
w_sigma: 1.0

mask_dead_dims: false
dead_dim_std_thresh: 1.0e-3
eval_deterministic: true

# Optimization (same as v11)
batch_size: 8192
num_steps: 30_000
learning_rate: 3.0e-4
weight_decay: 1.0e-3
grad_clip: 1.0
lr_schedule: cosine
lr_warmup_frac: 0.04
lr_hold_frac: 0.20
lr_end_value: 3.0e-5

# Logging / checkpointing (same as v11)
log_every: 250
eval_every: 500
ckpt_dir: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_prior_v12
ckpt_every: 5_000

# wandb
wandb_enabled: true
wandb_project: latent-mimic
wandb_run_name: phase1-rodent-v12-qvel
wandb_tags: ["phase1", "rodent", "qvel", "conv1d", "split-body-groups",
             "sigma-curriculum", "v12", "anti-overfit"]
wandb_group: null
viz_n_dims: 12                            # v11 was 6 — show some joints, not just root
viz_every: 5_000
