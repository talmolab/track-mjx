# =============================================================================
# Code Generation Experiment Configuration
# =============================================================================
# 4 generative methods: empirical TM, dynamax HMM, ARHMM L1, ARHMM L2.
# Free-loop rollouts + control experiments.
# =============================================================================

# Code2Act: MoSeq decoder checkpoint
checkpoint:
  path: /home/jovyan/vast/kaiwen/track-mjx/moseq_jax/model_checkpoints/260326_014031_608396/
  step: 70

# Mimic-MJX: Oracle VAE baseline (survival upper bound)
mimic_checkpoint:
  path: /home/jovyan/vast/kaiwen/track-mjx/moseq_jax/trained_mimic_ckpts/260405_235031_234849/
  step: null

data:
  codes_path: /home/jovyan/vast/kaiwen/track-mjx/moseq_jax/outputs/kpms_sweep/best_codes.npz
  balanced_split_path: /home/jovyan/vast/kaiwen/track-mjx/data/rodent/rodent_balanced_splits.json
  reference_data_path: /home/jovyan/vast/kaiwen/track-mjx/data/rodent/rodent_reference_clips.h5

generation:
  methods: ["transition_matrix", "hmm_dynamax", "arhmm_level1", "arhmm_level2"]

  transition_matrix:
    temperatures: [0.5, 1.0, 2.0]

  hmm_dynamax:
    num_states_sweep: [4, 8, 16, 32]
    num_em_iters: 100
    train_ratio: 0.8
    seed: 0

  arhmm:
    model_path: /home/jovyan/vast/kaiwen/track-mjx/moseq_jax/outputs/kpms_sweep/s50_k1e+04_l10_arhmm/seed1/keypoint_arhmm_states50_seed1/checkpoint.h5
    snapshot_idx: 50

  num_sequences: 10
  sequence_length: 500
  seed: 42

free_loop:
  max_steps: 1000
  seed: 42

controls:
  uniform_random: true
  single_code: true
  reversed: true

rendering:
  fps: 50
  width: 640
  height: 480
  camera_distance: 0.8
  camera_elevation: -30.0
  camera_azimuth: 135.0
  camera_fovy: 60.0

wandb:
  enabled: true
  project: moseq-eval
  entity: null

output:
  base_dir: ./outputs/moseq_code_generation

env_config:
  mujoco_impl: "jax"
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  nconmax: 256
  njmax: 128
  noslip_iterations: 0
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50
  clip_length: 250
  clip_set: "all"
  reference_length: 5
  start_frame_range: [0, 0]
  qvel_init: "zeros"
  keep_clips_idx: null
  domain_randomization:
    use_domain_randomization: false
    floor_friction: [0.7, 0.7]
    static_friction_scale: [1.0, 1.0]
    armature_scale: [1.0, 1.0]
    com_jitter: [0.0, 0.0]
    link_mass_scale: [1.0, 1.0]
    torso_mass_jitter: [0.0, 0.0]
    qpos0_jitter: [0.0, 0.0]
  reward_terms:
    root_pos: {exp_scale: 0.035, weight: 1.0}
    root_quat: {exp_scale: 20.0, weight: 1.0}
    joints: {exp_scale: 1.41, weight: 1.0}
    joints_vel: {exp_scale: 1.0, weight: 0.5}
    bodies_pos: {exp_scale: 0.25, weight: 0.0}
    end_eff: {exp_scale: 0.03, weight: 1.0}
    torso_z_range: {healthy_z_range: [0.0325, 0.5], weight: 1.0}
    control_cost: {weight: 0.02}
    control_diff_cost: {weight: 0.02}
    energy_cost: {max_value: 50.0, weight: 0.01}
  termination_criteria:
    root_too_far: {max_distance: 0.2}
    root_too_rotated: {max_degrees: 90.0}
    pose_error: {max_l2_error: 6.0}
    nan_termination: {}

walker_config:
  walker_name: "rodent"
  torque_actuators: true
  rescale_factor: 0.9
