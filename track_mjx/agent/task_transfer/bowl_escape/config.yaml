# Bowl Escape Task Transfer Training Config
#
# Two training modes:
#   decoder_only: Freeze decoder, train new encoder
#   prior_decoder: Freeze prior + decoder, train residual encoder
#
# Usage:
#   python -m track_mjx.agent.task_transfer.bowl_escape.train mode=decoder_only
#   python -m track_mjx.agent.task_transfer.bowl_escape.train mode=prior_decoder

defaults:
  - _self_

# Training mode: "decoder_only" or "prior_decoder"
mode: "decoder_only"

# Checkpoint to load (mlp_prior checkpoint)
checkpoint:
  path: "./model_checkpoints/YYMMDD_HHMMSS"  # Replace with your checkpoint
  step: null  # null = latest

# Mode-specific settings
decoder_only:
  # No extra config needed for decoder_only mode
  _placeholder: true

prior_decoder:
  # Whether to use prior mean only (no noise)
  deterministic_prior: true
  # Fixed log-variance for noise sampling (used when deterministic_prior=false)
  noise_logvar: -2.0

# Network architecture
network:
  policy_layers: [1024, 512, 256]
  value_layers: [1024, 512, 256]

# Training parameters
train:
  num_timesteps: 2_000_000_000  # 300M
  episode_length: 2000
  num_envs: 4096
  batch_size: 1024
  num_minibatches: 16
  num_updates_per_batch: 4
  learning_rate: 1e-4
  entropy_cost: 1e-4
  discounting: 0.99
  clipping_epsilon: 0.2
  gae_lambda: 0.95
  max_grad_norm: 50.0
  vf_loss_coefficient: 5.0
  reward_scaling: 1.0
  normalize_observations: true
  unroll_length: 20
  action_repeat: 1
  seed: 0
  eval_every: 15_000_000

# Environment settings
env:
  target_speed: 1.0
  # Sliding friction for bowl heightfield (MuJoCo default is 1.0, rodent paws have 1.5)
  hfield_friction: 1.0
  # Reward term weights (from vnl_playground bowl_escape task)
  reward_weights:
    escape_x_upright: 1.0
    speed: 1.0

# Logging settings
logging:
  project: "vnl-playground"
  group_name: "bowl_escape_transfer"
  exp_name: "bowl_escape_transfer"
  render_camera: "close_profile-rodent"
  render_fps: 50
