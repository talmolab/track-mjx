# =============================================================================
# VQ-VAE Unified Analysis Configuration
# =============================================================================
# Central configuration for all analysis tasks:
#   - Building transition matrices from clip inference
#   - Rendering clips with code transition bars
#   - Generating transition graphs and matrices
#   - Creating visualizations
#
# Usage:
#   python -m analysis.analyze --config configs/analysis_config.yaml
#   python -m analysis.analyze --config configs/analysis_config.yaml --mode transitions
#   python -m analysis.analyze --config configs/analysis_config.yaml --mode render
#   python -m analysis.analyze --config configs/analysis_config.yaml --mode visualize
# =============================================================================

# =============================================================================
# Checkpoint Configuration
# =============================================================================
checkpoint:
  # Path to VQ-VAE checkpoint directory
  path: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/model_checkpoints/260117_214649_852314
  # Checkpoint step to load (null = latest)
  step: null

# =============================================================================
# Output Configuration
# =============================================================================
output:
  # Base directory for all outputs
  base_dir: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/outputs/analysis
  # Whether to save metrics as JSON
  save_metrics: true

# =============================================================================
# Transition Matrix Building Configuration
# =============================================================================
transitions:
  # Enable/disable transition matrix building
  enabled: true
  # Number of clips to use for building transitions
  num_clips: 100
  # Random seed
  seed: 42
  # Output subdirectory
  output_subdir: transitions

# =============================================================================
# Rendering Configuration (Nature Paper Style)
# =============================================================================
render:
  # Enable/disable clip rendering
  enabled: true
  # Render all clips used for transition matrix
  render_all_transition_clips: true
  # Camera name for MuJoCo rendering
  # Options: close_profile-ghost, back-ghost, top-ghost, egocentric-rodent
  camera: close_profile-ghost
  # Individual video dimensions
  cell_width: 320
  cell_height: 240
  # Frame rate
  fps: 50
  # Output subdirectory
  output_subdir: renders

  # === Grid Rendering (Nature Paper Style) ===
  # Create grid montages of multiple clips
  create_grid: true
  # Maximum rows/columns per grid (Nature paper style)
  max_grid_rows: 5
  max_grid_cols: 5
  # Grid padding between cells
  grid_padding: 4
  # Grid background color (RGB)
  grid_bg_color: [255, 255, 255]

  # === Code Transition Bar Settings ===
  code_bar:
    # Height of the code color bar
    height: 40
    # Show playhead marker
    show_playhead: true
    # Playhead width in pixels
    playhead_width: 3
    # Show current code label
    show_code_label: true
    # Font size for code label
    font_size: 16
    # Label position: "top_left", "top_right", "bottom_left", "bottom_right"
    label_position: top_left
    # Add code transition count annotations
    show_transition_counts: false

  # === Text Overlay Settings ===
  overlay:
    # Font size for overlays
    font_size: 16
    # Show clip index
    show_clip_idx: true
    # Show reward
    show_reward: false
    # Text color (RGB)
    text_color: [255, 255, 255]
    # Background color (RGBA)
    bg_color: [0, 0, 0, 180]

# =============================================================================
# Inference Configuration
# =============================================================================
inference:
  # Enable/disable inference analysis (for specific clip analysis)
  enabled: false
  # Clips to analyze (list of indices) - used when running focused analysis
  clip_indices: [0, 1, 2]
  # Random seed
  seed: 42
  # Maximum steps per rollout (null = full episode)
  max_steps: null
  # Output subdirectory
  output_subdir: inference

# =============================================================================
# Transition Graph/Matrix Visualization Configuration
# =============================================================================
transition_viz:
  # Enable/disable transition visualizations
  enabled: true
  # Output subdirectory
  output_subdir: transition_graphs

  # === Transition Matrix Heatmap ===
  matrix:
    # Create transition matrix heatmap
    enabled: true
    # Use log scale for better visibility
    log_scale: true
    # Colormap
    cmap: Blues
    # Figure size (width, height)
    figsize: [12, 10]
    # Show raw counts vs probabilities
    show_counts: true
    show_probs: true

  # === Transition Graph (Network) ===
  graph:
    # Create network graph visualization
    enabled: true
    # Minimum edge weight to display (fraction of max)
    min_edge_weight: 0.01
    # Node size scaling factor
    node_size_scale: 100
    # Edge width scaling factor
    edge_width_scale: 3.0
    # Layout algorithm: "spring", "circular", "kamada_kawai"
    layout: spring
    # Figure size
    figsize: [14, 14]
    # Show top N hub codes
    show_hub_codes: 10

  # === Summary Statistics ===
  summary:
    # Print transition summary
    enabled: true
    # Show bidirectional pairs
    show_bidirectional: true
    # Show likely chains (A->B->C)
    show_chains: true

# =============================================================================
# Codebook Visualization Configuration
# =============================================================================
visualization:
  # Enable/disable codebook visualizations
  enabled: true
  # Output subdirectory
  output_subdir: visualizations

  # === 2D Projection ===
  projection:
    # Projection method: "pca" or "umap"
    method: pca
    # Figure size
    figsize: [10, 10]
    # Show code index labels
    show_labels: true
    # Point size
    point_size: 100

  # === Usage Histogram ===
  histogram:
    # Create usage histogram
    enabled: true
    # Figure size
    figsize: [14, 5]
    # Highlight threshold (highlight codes used more than this)
    highlight_threshold: null

  # === Codebook with Usage ===
  codebook_usage:
    # Create codebook plot colored by usage
    enabled: true
    # Colormap
    cmap: YlOrRd

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
  # Logging level: DEBUG, INFO, WARNING, ERROR
  level: INFO
  # Log to file (in addition to console)
  log_to_file: true
  # Log filename
  log_filename: analysis.log
