# =============================================================================
# VQ-VAE Per-Clip Analysis Configuration
# =============================================================================
# Pipeline for analyzing VQ-VAE code patterns on a per-clip basis:
# - Transition matrices and probability heatmaps per clip
# - Interactive HTML viewer with slider navigation
# - Video rendering with code timeline overlays
# =============================================================================

# =============================================================================
# Checkpoint Configuration
# =============================================================================
checkpoint:
  path: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/model_checkpoints/260209_232426_939844/
  step: null  # null = latest step

# =============================================================================
# WandB Configuration
# =============================================================================
wandb:
  enabled: true          # Enable WandB logging for analysis session
  project: "vqvae-analysis"
  entity: null            # WandB entity (team or username)

# =============================================================================
# Data Source Configuration
# =============================================================================
# Analysis loads pre-computed rollout data from H5 files.
# Use `python -m inference.run_inference` to generate H5 files.
data:
  h5_path: ./outputs/rollout_rvq_32.h5  # Path to H5 file with rollout data (required)
  clip_length: 500               # Frames per clip (for environment setup)

# =============================================================================
# Per-Clip Analysis Configuration
# =============================================================================
# All analysis is done per-clip: transition matrices,
# transition graphs, and video rendering with code overlays.
per_clip:
  enabled: false                  # Enable per-clip analysis
  num_clips: 5                 # Number of clips to analyze
  n_communities: null           # Communities per clip (null = auto-detect)
  render_videos: false           # Render videos with code bars

# =============================================================================
# Transition Context Analysis Configuration
# =============================================================================
# Analyze whether top K codes serve the same function across different clips
# by comparing their transition contexts (predecessor/successor distributions).
transition_context:
  enabled: true                 # Enable transition context analysis
  top_k: 5                     # Number of top codes to analyze
  min_clips: 3                  # Minimum clips a code must appear in
  render_videos: true           # Render transition videos (pred → code → succ)
  max_videos_per_code: 4        # Maximum videos per code
  conditional:
    enabled: true               # Enable qpos-conditioned transition analysis
    qpos_threshold: 0.05        # Mean absolute difference threshold (radians)
    max_videos: 4               # Maximum comparison videos per code (deprecated)
    max_matched_videos: 4       # Videos with matching transitions
    max_unmatched_videos: 4     # Videos with different transitions
    match_window_size: 10        # Number of future frames to compare for matched/unmatched

  # Popular code pose gallery - render where each popular code starts across clips
  pose_gallery:
    enabled: false               # Enable pose gallery rendering
    top_k_codes: 5              # Number of popular codes to visualize
    videos_per_code: 4          # Clips to sample per code
    context_frames: 15          # Frames before/after code start

# =============================================================================
# Mutual Information Analysis Configuration
# =============================================================================
# Quantifies which behavioral features are most encoded by the codebook.
# Uses the KSG estimator (Kraskov-Stögbauer-Grassberger) for MI computation.
mutual_information:
  enabled: true
  n_neighbors: 5                # KSG estimator k-neighbors
  min_mi_threshold: 0.05        # Minimum MI (nats) to include in heatmap
  top_k_features: 8             # Max features to show in heatmap
  posture_pcs: 3                # Number of posture PCA components

# =============================================================================
# RVQ Analysis Configuration
# =============================================================================
# Multi-depth RVQ analyses: parent-child heatmap, intra-parent diversity,
# hierarchical transition rates. Skipped automatically for depth=1 models.
rvq_analysis:
  enabled: true
  parent_child_heatmap: true
  intra_parent_diversity: true
  hierarchical_transitions: true

# =============================================================================
# Qpos+Code Determinism Analysis Configuration
# =============================================================================
# Test whether the same starting pose + same code progression produces similar
# qpos trajectories. Computes Wasserstein-2 distance between trajectory pairs
# that share code sequences and similar starting poses.
qpos_code_determinism:
  enabled: true
  num_clips: 842               # Number of clips to analyze
  min_k: 2                     # Minimum number of transitions
  max_k: 8                     # Maximum number of transitions
  grace_window: 10             # Boundary alignment tolerance (frames)
  qpos_threshold: 0.05         # Max mean abs diff for starting qpos match

# =============================================================================
# Compositional Transition Analysis Configuration
# =============================================================================
# Analyze whether longer code transition sequences decompose into independently
# observed shorter ones. Builds decomposition trees showing how k-transitions
# break down into sub-sequences, with determinism scores at each level.
compositional_transition:
  enabled: true                 # ON for initial testing
  num_clips: 842               # Number of clips to analyze
  min_k: 2                     # Minimum number of transitions
  max_k: 8                     # Maximum number of transitions
  grace_window: 20             # Boundary alignment tolerance (frames)
  qpos_threshold: 0.05         # Max mean abs diff for starting qpos match
  top_n_sequences: 3           # Top N most popular distinct sequences per k
  max_examples: 5              # Max example videos per top-level sequence
  max_child_examples: 3        # Max example videos per decomposition child
  max_overlap: 2               # Max boundary overlap (codes) before dedup
  render_videos: true          # Render example videos in tree nodes

# =============================================================================
# t-SNE Skill-Space Trajectory Visualization
# =============================================================================
# Visualize how clips traverse the "skill space" by embedding k-transition
# sequences (concatenated codebook vectors) into 2D via t-SNE. Creates a
# synchronized HTML viewer with animated canvas + video playback.
tsne_trajectory:
  enabled: true                 # Enable t-SNE trajectory visualization
  n_clips: 3                    # Number of high-movement clips to compare
  k_transitions: 3              # Number of code transitions per t-SNE point
  tsne_perplexity: 30           # t-SNE perplexity parameter
  render_videos: true           # Render clip videos for synchronized viewer
  umap_n_neighbors: 15          # UMAP n_neighbors (larger = more global)
  umap_min_dist: 0.1            # UMAP min_dist (smaller = tighter clusters)
  xy_vs_xyz:
    n_clips_per_group: 1        # Clips per group in XY vs XYZ comparison

# =============================================================================
# Rendering Configuration
# =============================================================================
render:
  camera: close_profile     # Camera name (suffix will be added)
  fps: 50                   # Frames per second for videos
  width: 640                # Video width (high resolution)
  height: 480               # Video height (high resolution)

# =============================================================================
# Output Configuration
# =============================================================================
output:
  base_dir: ./outputs/code_analysis

# =============================================================================
# Environment Configuration
# =============================================================================
env_config:
  mujoco_impl: "jax"

  # Physics Solver Settings
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  nconmax: 256
  njmax: 128
  noslip_iterations: 0

  # Timing Configuration
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50

  # Reference Clip Settings
  clip_length: 250
  clip_set: "all"
  reference_length: 5
  start_frame_range: [0, 50]
  qvel_init: "zeros"
  keep_clips_idx: null

  # Domain Randomization (disabled for analysis)
  domain_randomization:
    use_domain_randomization: false
    floor_friction: [0.7, 0.7]
    static_friction_scale: [1.0, 1.0]
    armature_scale: [1.0, 1.0]
    com_jitter: [0.0, 0.0]
    link_mass_scale: [1.0, 1.0]
    torso_mass_jitter: [0.0, 0.0]
    qpos0_jitter: [0.0, 0.0]

  # Reward Terms
  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.41
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0
    end_eff:
      exp_scale: 0.03
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # Termination Criteria
  termination_criteria:
    root_too_far:
      max_distance: 0.15
    root_too_rotated:
      max_degrees: 75.0
    pose_error:
      max_l2_error: 5.0
    nan_termination: {}

