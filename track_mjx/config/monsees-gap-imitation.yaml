# =============================================================================
# Monsees Gap-Crossing Imitation Training
# =============================================================================
# Imitation learning from Monsees et al. (2022) gap-crossing reference clips.
# 44 clips x 100 frames @ 50Hz, registered with STAC-MJX.
#
# Based on rodent-full-clips.yaml with adjustments for Monsees data:
#   - clip_length: 100 (2s trials @ 50Hz)
#   - start_frame_range: [0, 10] (short clips)
#   - reference_data_path: Monsees gap-crossing clips
# =============================================================================

env_config:
  env_name: "RodentImitation"
  mujoco_impl: "warp"

  # Physics solver (aligned with rodent-full-clips)
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  naconmax: 30720              # 1024 envs * 30 contacts/env
  njmax: 400
  noslip_iterations: 0

  # Timing
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50

  # Reference clip settings (Monsees gap-crossing)
  reference_data_path: "/home/talmolab/Desktop/SalkResearch/monsees-retarget/output/monsees_gap_reference_clips.h5"
  clip_length: 100
  clip_set: "all"
  reference_length: 5
  reference_stride: 1
  start_frame_range: [0, 10]
  qvel_init: "zeros"
  keep_clips_idx: null

  # Domain randomization
  domain_randomization:
    use_domain_randomization: true
    floor_friction: [0.4, 1.0]
    static_friction_scale: [0.9, 1.1]
    armature_scale: [1.0, 1.05]
    com_jitter: [-0.05, 0.05]
    link_mass_scale: [0.9, 1.1]
    torso_mass_jitter: [-0.02, 0.02]
    qpos0_jitter: [-0.05, 0.05]

  # Reward terms
  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.4
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0
    end_eff:
      exp_scale: 0.03
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # Termination criteria
  termination_criteria:
    root_too_far:
      max_distance: 0.1
    root_too_rotated:
      max_degrees: 60.0
    pose_error:
      max_l2_error: 4.5
    nan_termination: {}

# Rendering
render_config:
  render_camera_name: close_profile
  render_fps: 50
  render_interval: 1

# Network architecture (intention-based, same as rodent-full-clips)
network_config:
  arch_name: intention
  encoder_layer_sizes: [1024, 1024, 512]
  decoder_layer_sizes: [1024, 1024, 512]
  critic_layer_sizes: [2048, 1024, 1024, 1024, 512]
  intention_size: 16
  proprioception_noise_std: 0.3
  proprioception_noise_mode: additive
  kl_schedule: true
  latent_kl_weight: 1e-1
  latent_ar1_weight: 0.0

# Training setup
train_setup:
  agent_name: rodent
  run_name: monsees_gap

  checkpoint_to_restore: null
  restore_from_run_state: null

  train_test_split_info: null
  train_subset_ratio: 0.8

  eval_every: 50_000_000
  episode_length: 200
  reset_every: 50_000_000

  train_config:
    num_envs: 1024
    num_timesteps: 2_000_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 1e-4
    lr_schedule: constant             # "constant", "linear", or "cosine"
    lr_end_value: 0.0                 # final LR (only used when lr_schedule != constant)
    lr_warmup_frac: 0.0               # fraction of total optimizer steps for warmup
    grad_clip_threshold: 20.0
    clipping_epsilon: 0.2
    discounting: 0.95
    action_repeat: 1
    entropy_cost: 1e-2
    vf_loss_coefficient: 0.25
    reward_scaling: 1
    normalize_observations: true
    unroll_length: 20
    seed: 0
    get_activation: false
    deterministic_eval: true

# Logging
logging_config:
  project_name: vnl-playground
  group_name: monsees-gap-imitation
  exp_name: monsees_gap_v1
  clip_id: -1
  model_path: model_checkpoints/

# Walker
walker_config:
  walker_name: "rodent"
  torque_actuators: true
  rescale_factor: 0.9
  reference_data_path: "/home/talmolab/Desktop/SalkResearch/monsees-retarget/output/monsees_gap_reference_clips.h5"
