# track_mjx/config/latent_mimic_phase2_v9c.yaml
#
# Phase 2 v9c — v14 prior (3-way root[4]/axial[8]/limb[12] split, jitter fix)
#               + per-branch r_mimic with [6,1,1] root weight (escalated from
#               v9b's [3,1,1] per the rubric — v9b had KL_root as the slowest-
#               dropping branch, suggesting more boost is warranted).
#               + 1.5B steps (2× v9b) for sustained convergence.
#
# What we expect to gain over v9b:
# 1. **Jitter eliminated**: v14's 4-dim root branch is an information bottleneck
#    that compresses out the high-freq components causing v9b's chatter.
# 2. **Better root tracking**: [6,1,1] weights root at 47% of weighted KL
#    (vs 33% with [3,1,1] in v9b). With less encoder content to chase, the
#    policy can devote more action budget to coarse global pose.
# 3. **Higher ep_len**: 1.5B steps gives the policy more time to escape any
#    residual local optima around clip-specific failures.
#
# Calibration sketch (from v9b's converged metrics, applied with new weights):
#   v9b end: KL_root 30, KL_axial 56, KL_limb 55
#   With [6,1,1]: weighted KL = 6·30 + 56 + 55 = 291
#   Same w_r=2e-3 → exp(-2e-3·291) = 0.557 (slightly below 0.5 sweet spot — fine,
#   means more headroom to climb to higher r as policy improves further)
#   At convergence in v9c, expect weighted KL to drop ~30-50% → r/step 0.7-0.8.

defaults:
  - rodent-full-clips
  - _self_

env_config:
  reward_terms: {}
  njmax: 800
  termination_criteria:
    nan_termination: {}
    root_too_far:
      max_distance: 0.3
    pose_error:
      max_l2_error: 6.0
  domain_randomization:
    use_domain_randomization: false

latent_mimic:
  prior_dir: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_prior_v14/best
  w_r: 2.0e-3                              # carry forward from v9b
  history_len: 0
  n_joints: 67
  kl_mode: full

  drop_dead_orientations: true
  proprio_var_threshold: 1.0e-8

  use_predictor: true
  sigma_clamp: 0.10                        # match v14 σ_max ceiling

  # ESCALATED: was [3,1,1] in v9b. KL_root was slowest-dropping branch in v9b
  # (32% reduction vs 42-45% for axial/limb). With v14's narrower root branch,
  # 6× weight should produce stronger differential gradient on root tracking.
  branch_kl_weights: [6.0, 1.0, 1.0]

network_config:
  arch_name: latent_mimic
  policy_layer_sizes: [512, 256, 128]
  value_layer_sizes: [512, 256, 128]

train_setup:
  agent_name: rodent
  run_name: phase2_v9c2_v14prior_3way_root6x_wr2e3_1500M_actrep2
  checkpoint_to_restore: null
  restore_from_run_state: null
  train_test_split_info: null
  train_subset_ratio: 0.8
  eval_every: 25_000_000
  episode_length: 200
  reset_every: 50_000_000
  freeze_decoder: false
  train_config:
    num_envs: 2048                         # carry forward from v9b
    num_timesteps: 1_500_000_000           # 1.5B (2× v9b's 750M)
    batch_size: 1024                       # carry forward from v9b
    num_minibatches: 8
    num_updates_per_batch: 4
    learning_rate: 1.0e-4
    lr_schedule: constant
    lr_end_value: 0.0
    lr_warmup_frac: 0.0
    clipping_epsilon: 0.2
    discounting: 0.95
    action_repeat: 2                       # CHANGED from 1 (anti-jitter restart).
                                            # Mocap is 50 Hz, ctrl_dt 0.01 → policy
                                            # ran at 100 Hz which forced 2 decisions
                                            # per ref frame. Now policy decides
                                            # once per ref frame (50 Hz). Each
                                            # decision is held for 2 physics-control
                                            # intervals. Hypothesized to remove a
                                            # major source of high-freq jitter that
                                            # the per-branch KL + higher w_r couldn't
                                            # train through. Side effect: half the
                                            # PPO updates per env-timestep — accept
                                            # this in exchange for the smoothness gain.
    entropy_cost: 1.0e-2
    vf_loss_coefficient: 0.25
    reward_scaling: 1
    normalize_observations: true
    unroll_length: 10
    seed: 0
    get_activation: false
    deterministic_eval: true

logging_config:
  project_name: latent-mimic
  group_name: phase2
  exp_name: phase2_v9c2_v14prior_3way_root6x_wr2e3_1500M_actrep2
  clip_id: -1
  model_path: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_phase2_v9c

checkpoint_dir: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_phase2_v9c
