# =============================================================================
# VQ-VAE Prior Distillation Configuration
# =============================================================================
# Configuration for training a Prior network from a frozen VQ-VAE checkpoint.
# The Prior learns to predict encoder outputs (z_e) from proprioception only.
#
# Key differences from VQ-VAE training:
# 1. VQ-VAE encoder, decoder, and codebook are FROZEN (loaded from checkpoint)
# 2. Only the Prior network is TRAINABLE
# 3. Loss is MSE(z_p, z_e) instead of full RL loss
# 4. Freeloop evaluation tests Prior without reference trajectories
# =============================================================================

# =============================================================================
# VNL Environment Configuration
# =============================================================================
env_config:
  mujoco_impl: "jax"

  # Physics Solver Settings (same as VQ-VAE training)
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  nconmax: 256
  njmax: 128
  noslip_iterations: 0

  # Timing Configuration
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50

  # Reference Clip Settings
  clip_length: 250
  clip_set: "all"
  reference_length: 5
  start_frame_range: [0, 50]
  qvel_init: "zeros"
  keep_clips_idx: null

  # Domain Randomization - Match VQ-VAE training
  domain_randomization:
    use_domain_randomization: false
    floor_friction: [0.7, 0.7]
    static_friction_scale: [1.0, 1.0]
    armature_scale: [1.0, 1.0]
    com_jitter: [0.0, 0.0]
    link_mass_scale: [1.0, 1.0]
    torso_mass_jitter: [0.0, 0.0]
    qpos0_jitter: [0.0, 0.0]

  # Reward Terms (same as VQ-VAE - used for VQ-VAE policy data collection)
  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.41
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0
    end_eff:
      exp_scale: 0.03
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # Termination Criteria
  termination_criteria:
    root_too_far:
      max_distance: 0.15
    root_too_rotated:
      max_degrees: 75.0
    pose_error:
      max_l2_error: 5.0
    nan_termination: {}

# =============================================================================
# Rendering Configuration
# =============================================================================
render_config:
  render_camera_name: close_profile
  render_fps: 50
  render_interval: 10

# =============================================================================
# Network Architecture - VQ-VAE Prior
# =============================================================================
network_config:
  arch_name: vq_prior_distill

  # Prior Network Architecture
  # The Prior takes proprio and predicts z_e (encoder output)
  prior_layer_sizes: [1024, 1024, 512, 512]  # Match VAE prior architecture

# =============================================================================
# VQ-VAE Checkpoint Configuration
# =============================================================================
vqvae_config:
  # Path to frozen VQ-VAE checkpoint
  checkpoint_path: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/model_checkpoints/260117_214649_852314/
  checkpoint_step: null  # null = latest step

# =============================================================================
# Prior Distillation Loss Configuration
# =============================================================================
loss_config:
  # Alignment loss type: "mse", "l2", "smooth_l1", "cosine", "combined"
  loss_type: mse

  # AR(1) Temporal Smoothness Loss
  # Encourages smooth prior predictions over time
  ar_weight: 0.0  # Start with 0, can enable if needed
  phi: 0.99       # AR(1) coefficient (same as PULSE)

  # AR schedule (optional warmup)
  use_ar_schedule: false
  ar_schedule_params:
    start_value: 0.0
    end_value: 1e-3
    start_frac: 0.3
    end_frac: 0.6
    schedule_type: linear

  # Smooth L1 parameters (if loss_type="smooth_l1")
  smooth_l1_delta: 1.0

  # Combined loss parameters (if loss_type="combined")
  mse_weight: 1.0
  cosine_weight: 0.1

# =============================================================================
# Freeloop Evaluation Configuration
# =============================================================================
freeloop_config:
  enabled: true
  num_rollouts: 1               # Number of freeloop rollouts per eval
  max_steps: 200                # Max steps per freeloop rollout
  quantize_prior: true          # Quantize z_p to nearest codebook entry
  deterministic: true           # Use deterministic actions
  eval_interval: 5              # Run freeloop every N evals
  render_best_rollout: true     # Render video of best rollout
  render_fps: 50
  render_camera_name: close_profile

# =============================================================================
# Training Setup
# =============================================================================
train_setup:
  agent_name: rodent
  run_name: vq_prior_distill

  checkpoint_to_restore: null
  restore_from_run_state: null

  train_test_split_info: null
  train_subset_ratio: 0.8

  # Evaluation and resets
  eval_every: 20_000_000
  episode_length: 200
  reset_every: 20_000_000

  # Training Hyperparameters
  train_config:
    num_envs: 4096
    num_timesteps: 500_000_000   # Less than VQ-VAE (prior is simpler)
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 3e-4          # Higher LR for supervised learning
    grad_clip_norm: 20.0         # Gradient clipping
    action_repeat: 1
    normalize_observations: true
    unroll_length: 20
    seed: 0
    deterministic_eval: true

# =============================================================================
# Logging Configuration
# =============================================================================
logging_config:
  project_name: vqvae_experiments
  group_name: prior_distill
  exp_name: vq_prior_mse
  model_path: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/model_checkpoints/prior_distill

