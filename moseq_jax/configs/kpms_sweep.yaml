# =============================================================================
# KPMS Hyperparameter Sweep Configuration
# =============================================================================
# Grid search over KPMS settings to find the best syllable model.
#
# IMPORTANT: This sweep MUST run in a separate process from RL training
# because keypoint_moseq requires jax_enable_x64=True (process-global).
#
# Usage:
#   cd moseq_jax
#   python -m sweep.run_sweep
# =============================================================================

data:
  reference_data_path: /n/holylfs06/LABS/olveczky_lab/Users/charleszhang/track-mjx/data/rodent/rodent_reference_clips.h5
  balanced_split_path: /n/holylfs06/LABS/olveczky_lab/Users/charleszhang/track-mjx/data/rodent/rodent_balanced_splits.json
  stac_xml_path: /n/holylfs06/LABS/olveczky_lab/Users/charleszhang/stac-mjx/models/rodent.xml

sweep:
  num_states: [10, 20, 30, 50]
  kappa: [1.0e+3, 1.0e+4, 1.0e+5]
  latent_dim: [10]
  model_type: ["arhmm", "slds"]
  seeds_per_setting: 2
  ar_iters: 50
  full_iters: 300

output:
  base_dir: outputs/kpms_sweep

codegen:
  sweep_results: outputs/kpms_sweep/sweep_results.json
  balanced_split: /n/holylfs06/LABS/olveczky_lab/Users/charleszhang/track-mjx/data/rodent/rodent_balanced_splits.json
  output: outputs/kpms_sweep/best_codes.npz

wandb:
  enabled: true
  project: moseq_experiments
  group: kpms_sweep
