# =============================================================================
# VQ-VAE Minimal Experiment Configuration
# =============================================================================
# Minimal configuration for testing VQ-VAE implementation.
# Uses small settings for fast iteration and debugging.
# =============================================================================

# =============================================================================
# VNL Environment Configuration
# =============================================================================
env_config:
  mujoco_impl: "jax"

  # Physics Solver Settings (same as production)
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  naconmax: 256
  njmax: 128
  noslip_iterations: 0

  # Timing Configuration
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50

  # Reference Clip Settings - MINIMAL
  clip_length: 250              # Shorter clips for faster iteration
  clip_set: "all"               # Use all clips
  reference_length: 5
  start_frame_range: [0, 20]    # Smaller range
  qvel_init: "zeros"
  keep_clips_idx: null          # Use all clips (null = no filtering)

  # Domain Randomization - DISABLED for minimal testing
  domain_randomization:
    use_domain_randomization: false
    floor_friction: [0.7, 0.7]
    static_friction_scale: [1.0, 1.0]
    armature_scale: [1.0, 1.0]
    com_jitter: [0.0, 0.0]
    link_mass_scale: [1.0, 1.0]
    torso_mass_jitter: [0.0, 0.0]
    qpos0_jitter: [0.0, 0.0]

  # Reward Terms - Same as production
  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.41
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0
    end_eff:
      exp_scale: 0.03
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # Termination Criteria - More lenient for debugging
  termination_criteria:
    root_too_far:
      max_distance: 0.2         # More lenient
    root_too_rotated:
      max_degrees: 90.0         # More lenient
    pose_error:
      max_l2_error: 6.0         # More lenient
    nan_termination: {}

# =============================================================================
# Rendering Configuration
# =============================================================================
render_config:
  render_camera_name: close_profile
  render_fps: 50
  render_interval: 5            # Render more frequently for debugging
  render_per_code_videos: true # Render individual videos per code (slow)

# =============================================================================
# Network Architecture - VQ-VAE
# =============================================================================
network_config:
  arch_name: vqvae_intention    # NEW: VQ-VAE architecture

  # Encoder/Decoder sizes - SMALLER for fast iteration
  encoder_layer_sizes: [512, 256, 256]    # Reference trajectory encoder
  decoder_layer_sizes: [512, 512, 256, 256]  # Policy decoder
  critic_layer_sizes: [512, 512, 256, 256]   # Value function

  # Latent space settings
  intention_size: 32            # Richer embeddings for 64 codes
  latent_dim: 32                # Same as intention_size

  # VQ-VAE specific settings
  num_codes: 16                  # Enough for compositional structure
  commitment_cost: 0.5           # Lower initially, let codebook stabilize
  codebook_loss_weight: 1.0      # Weight for codebook loss
  codebook_init_scale: 0.1       # Initialization scale
  ce_stickiness_cost: 0.0        # Weight for cross-entropy stickiness loss (disabled, use bias instead)
  ce_stickiness_temperature: 1.0 # Temperature for CE stickiness softmax
  stickiness_bias: 3.5           # Bias for temporal code persistence (~2-3% transition rate)

  # Disable KL schedule (not used in VQ-VAE)
  kl_schedule: false
  kl_weight: 0.0

  # VQ-VAE loss schedule (optional warmup)
  vq_schedule: false
  vq_warmup_steps: 0
  vq_ramp_steps: 0

# =============================================================================
# Training Setup - MINIMAL
# =============================================================================
train_setup:
  agent_name: rodent
  run_name: vqvae_minimal_test

  checkpoint_to_restore: null
  restore_from_run_state: null

  train_test_split_info: null
  train_subset_ratio: 1.0       # Use all available clips

  # Evaluation and resets - FREQUENT for debugging
  eval_every: 20_000_000           # Eval more frequently
  episode_length: 200            # Shorter episodes
  reset_every: 20_000_000        # Reset less frequently

  # PPO Training Hyperparameters - MINIMAL
  train_config:
    num_envs: 4096               # Fewer envs for fast iteration
    num_timesteps: 1_000_000_000
    batch_size: 1024             # Smaller batch
    num_minibatches: 16          # Fewer minibatches
    num_updates_per_batch: 4    # Fewer updates
    learning_rate: 1e-4         # Slightly higher LR for faster learning
    clipping_epsilon: 0.2
    discounting: 0.95
    action_repeat: 1
    entropy_cost: 1e-2
    reward_scaling: 1
    normalize_observations: true
    unroll_length: 20           # Shorter unroll
    seed: 0
    get_activation: false
    deterministic_eval: true

# =============================================================================
# Logging Configuration
# =============================================================================
logging_config:
  project_name: vqvae_experiments
  group_name: minimal_tests
  exp_name: vqvae_multi_clip
  clip_id: 0  # Only used for eval video rendering, not training
  model_path: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/model_checkpoints

