# =============================================================================
# VQ-VAE Prior Noise Analysis Configuration
# =============================================================================
# Analyzes the effect of adding Gaussian noise to the continuous latent (z_p)
# before quantization. Tests how noise causes code switching and behavioral
# diversity in the trained prior model.
# =============================================================================

# =============================================================================
# Prior Model Checkpoint (trained prior network)
# =============================================================================
prior_config:
  checkpoint_path: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/model_checkpoints/prior_distill/260118_233428_286620/
  checkpoint_step: null  # null = latest step

# =============================================================================
# Frozen VQ-VAE Checkpoint (for decoder and codebook)
# =============================================================================
vqvae_config:
  checkpoint_path: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/model_checkpoints/260117_214649_852314/
  checkpoint_step: 48

# =============================================================================
# Noise Configuration
# =============================================================================
noise_config:
  # Noise levels (standard deviation) to test
  # 0.0 = no noise (baseline), higher = more perturbation
  noise_levels: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0, 5.0]

  # Noise type: "additive" (z_p + std * N(0,1))
  noise_type: additive

# =============================================================================
# Rollout Configuration
# =============================================================================
rollout_config:
  max_steps: 1000                # Steps per rollout (longer to see code switching)
  num_rollouts_per_noise: 5    # Number of rollouts per noise level
  quantize_prior: true          # Quantize z_p to nearest codebook entry
  deterministic: true           # Use deterministic actions (mean, no sampling)

# =============================================================================
# Rendering Configuration
# =============================================================================
render_config:
  enabled: true
  render_single_per_noise: true  # Only render 1 video per noise level
  fps: 50
  camera_name: close_profile

  # Code grid visualization (3x4 grid for 12 codes)
  show_code_grid: true
  grid_width: 100
  cell_size: 28

# =============================================================================
# Output Configuration
# =============================================================================
output_config:
  output_dir: ./noise_analysis_results
  save_videos: true
  save_trajectory_plots: true
  save_transition_matrices: true
  save_summary: true

# =============================================================================
# Environment Configuration (copied from prior training)
# =============================================================================
env_config:
  mujoco_impl: "jax"

  # Physics Solver Settings
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  nconmax: 256
  njmax: 128
  noslip_iterations: 0

  # Timing Configuration
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50

  # Reference Clip Settings
  clip_length: 250
  clip_set: "all"
  reference_length: 5
  start_frame_range: [0, 50]
  qvel_init: "zeros"
  keep_clips_idx: null

  # Domain Randomization (disabled for analysis)
  domain_randomization:
    use_domain_randomization: false
    floor_friction: [0.7, 0.7]
    static_friction_scale: [1.0, 1.0]
    armature_scale: [1.0, 1.0]
    com_jitter: [0.0, 0.0]
    link_mass_scale: [1.0, 1.0]
    torso_mass_jitter: [0.0, 0.0]
    qpos0_jitter: [0.0, 0.0]

  # Reward Terms (same as training)
  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.41
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0
    end_eff:
      exp_scale: 0.03
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # Termination Criteria
  termination_criteria:
    root_too_far:
      max_distance: 0.15
    root_too_rotated:
      max_degrees: 75.0
    pose_error:
      max_l2_error: 5.0
    nan_termination: {}

# =============================================================================
# Walker Configuration
# =============================================================================
walker_config:
  walker_name: "rodent"
  torque_actuators: true
  rescale_factor: 0.9

  joint_names:
    - vertebra_1_extend
    - hip_L_supinate
    - hip_L_abduct
    - hip_L_extend
    - knee_L
    - ankle_L
    - toe_L
    - hip_R_supinate
    - hip_R_abduct
    - hip_R_extend
    - knee_R
    - ankle_R
    - toe_R
    - vertebra_C11_extend
    - vertebra_cervical_1_bend
    - vertebra_axis_twist
    - atlas
    - mandible
    - scapula_L_supinate
    - scapula_L_abduct
    - scapula_L_extend
    - shoulder_L
    - shoulder_sup_L
    - elbow_L
    - wrist_L
    - scapula_R_supinate
    - scapula_R_abduct
    - scapula_R_extend
    - shoulder_R
    - shoulder_sup_R
    - elbow_R
    - wrist_R
    - finger_R

  body_names:
    - torso
    - pelvis
    - upper_leg_L
    - lower_leg_L
    - foot_L
    - upper_leg_R
    - lower_leg_R
    - foot_R
    - skull
    - jaw
    - scapula_L
    - upper_arm_L
    - lower_arm_L
    - finger_L
