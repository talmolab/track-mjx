# =============================================================================
# VQ-VAE Code Analysis Configuration
# =============================================================================
# Pipeline for analyzing VQ-VAE code patterns:
# - Global transition matrix and stationary distribution
# - t-SNE/UMAP trajectory visualization
# - Pose gallery for popular codes
# - Kinematic profiles per code
# =============================================================================

# =============================================================================
# Checkpoint Configuration
# =============================================================================
checkpoint:
  path: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/model_checkpoints/260312_081359_853010/
  step: null  # null = latest step

# =============================================================================
# WandB Configuration
# =============================================================================
wandb:
  enabled: true          # Enable WandB logging
  project: "vqvae-eval"
  entity: null            # WandB entity (team or username)

# =============================================================================
# Data Source Configuration
# =============================================================================
# Analysis loads pre-computed rollout data from H5 files.
# Use `python -m inference.run_inference` to generate H5 files.
data:
  h5_path: null  # Path to H5 file with rollout data (required)
  h5_path_train: null            # Path to train-split H5 (optional)
  h5_path_test: ./outputs/rollout_vqvae_rvq_test.h5  # Path to test-split H5
  analysis_split: "test"     # "train", "test", or "combined"
  clip_length: 500               # Frames per clip (for environment setup)

# =============================================================================
# Pose Gallery Configuration
# =============================================================================
# Render grid videos showing where each popular code starts across clips.
pose_gallery:
  enabled: true               # Enable pose gallery rendering
  top_k_codes: 5              # Number of popular transitions to visualize
  videos_per_code: 4          # Clips to sample per transition
  transition_length: 3        # Number of consecutive code runs per transition n-gram

# =============================================================================
# Kinematic Profile Configuration
# =============================================================================
# Render kinematic profile line plots per code (root speed, height, hip/knee angles).
kinematic_profile:
  enabled: true

# =============================================================================
# t-SNE Skill-Space Trajectory Visualization
# =============================================================================
# Visualize how clips traverse the "skill space" by embedding k-transition
# sequences (concatenated codebook vectors) into 2D via t-SNE. Creates a
# synchronized HTML viewer with animated canvas + video playback.
tsne_trajectory:
  enabled: false                 # Enable t-SNE trajectory visualization
  n_clips: 2                    # Number of high-movement clips to compare
  k_transitions: 2              # Number of code transitions per t-SNE point
  tsne_perplexity: 50           # t-SNE perplexity parameter
  render_videos: true           # Render clip videos for synchronized viewer
  umap_n_neighbors: 15          # UMAP n_neighbors (larger = more global)
  umap_min_dist: 0.1            # UMAP min_dist (smaller = tighter clusters)
  xy_vs_xyz:
    n_clips_per_group: 1        # Clips per group in XY vs XYZ comparison

# =============================================================================
# Rendering Configuration
# =============================================================================
render:
  camera: close_profile     # Camera name (suffix will be added)
  fps: 50                   # Frames per second for videos
  width: 640                # Video width (high resolution)
  height: 480               # Video height (high resolution)

# =============================================================================
# Output Configuration
# =============================================================================
output:
  base_dir: ./outputs/code_analysis

# =============================================================================
# Environment Configuration
# =============================================================================
env_config:
  env_name: "RodentImitation"
  mujoco_impl: "jax"

  # Physics Solver Settings
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  nconmax: 256
  njmax: 128
  noslip_iterations: 0

  # Timing Configuration
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50

  # Reference Clip Settings
  clip_length: 250
  clip_set: "all"
  reference_length: 5
  start_frame_range: [0, 50]
  qvel_init: "zeros"
  keep_clips_idx: null

  # Domain Randomization (disabled for analysis)
  domain_randomization:
    use_domain_randomization: false
    floor_friction: [0.7, 0.7]
    static_friction_scale: [1.0, 1.0]
    armature_scale: [1.0, 1.0]
    com_jitter: [0.0, 0.0]
    link_mass_scale: [1.0, 1.0]
    torso_mass_jitter: [0.0, 0.0]
    qpos0_jitter: [0.0, 0.0]

  # Reward Terms
  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.41
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0
    end_eff:
      exp_scale: 0.03
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # Termination Criteria
  termination_criteria:
    root_too_far:
      max_distance: 0.15
    root_too_rotated:
      max_degrees: 75.0
    pose_error:
      max_l2_error: 5.0
    nan_termination: {}

# =============================================================================
# Walker Configuration
# =============================================================================
walker_config:
  walker_name: "rodent"
  torque_actuators: true
  rescale_factor: 0.9

  joint_names:
    - vertebra_1_extend
    - hip_L_supinate
    - hip_L_abduct
    - hip_L_extend
    - knee_L
    - ankle_L
    - toe_L
    - hip_R_supinate
    - hip_R_abduct
    - hip_R_extend
    - knee_R
    - ankle_R
    - toe_R
    - vertebra_C11_extend
    - vertebra_cervical_1_bend
    - vertebra_axis_twist
    - atlas
    - mandible
    - scapula_L_supinate
    - scapula_L_abduct
    - scapula_L_extend
    - shoulder_L
    - shoulder_sup_L
    - elbow_L
    - wrist_L
    - scapula_R_supinate
    - scapula_R_abduct
    - scapula_R_extend
    - shoulder_R
    - shoulder_sup_R
    - elbow_R
    - wrist_R
    - finger_R

  body_names:
    - torso
    - pelvis
    - upper_leg_L
    - lower_leg_L
    - foot_L
    - upper_leg_R
    - lower_leg_R
    - foot_R
    - skull
    - jaw
    - scapula_L
    - upper_arm_L
    - lower_arm_L
    - finger_L
    - scapula_R
    - upper_arm_R
    - lower_arm_R
    - finger_R

  end_eff_names:
    - foot_L
    - foot_R
    - hand_L
    - hand_R
    - skull
