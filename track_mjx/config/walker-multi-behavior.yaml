# walker-multi-behavior.yaml
# Step 1: Train conditional MLP+PPO policy for multi-behavior walker

env_config:
  env_name: "WalkerMultiBehavior"
  sim_dt: 0.0025
  ctrl_dt: 0.025
  episode_length: 1000
  mujoco_impl: "jax"
  nconmax: 50000
  njmax: 100
  mode_switch_prob: 0.005
  fixed_mode: null  # null = random switching, 0-3 = fixed mode

network_config:
  policy_hidden_layer_sizes: [256, 256, 256]
  value_hidden_layer_sizes: [256, 256, 256]

train_config:
  num_timesteps: 100_000_000
  num_envs: 2048
  batch_size: 1024
  num_minibatches: 32
  num_updates_per_batch: 4
  learning_rate: 3.0e-4
  entropy_cost: 1.0e-2
  discounting: 0.97
  unroll_length: 10
  seed: 0
  normalize_observations: true

logging_config:
  project_name: "walker-topo"
  group_name: "step1-multi-behavior"
  exp_name: "baseline"
  log_to_wandb: true

checkpoint:
  save_dir: "checkpoints/walker_multi_behavior"
  save_every: 10_000_000  # Save every 10M steps
