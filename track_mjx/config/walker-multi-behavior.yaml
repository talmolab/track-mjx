# walker-multi-behavior.yaml
# Step 1: Train conditional MLP+PPO policy for multi-behavior walker

env_config:
  env_name: "WalkerMultiBehavior"
  sim_dt: 0.0025
  ctrl_dt: 0.025
  episode_length: 2000
  mujoco_impl: "warp"
  nconmax: 50000
  njmax: 100
  mode_duration_mean: 150  # Average steps per mode before switching
  mode_duration_min: 60    # Minimum steps before switching
  fixed_mode: null  # null = random switching, 0-7 = fixed mode

network_config:
  policy_hidden_layer_sizes: [256, 256, 256]
  value_hidden_layer_sizes: [256, 256, 256]

train_config:
  num_timesteps: 1_000_000_000
  num_envs: 8192
  batch_size: 1024
  num_minibatches: 32
  num_updates_per_batch: 4
  learning_rate: 3.0e-4
  entropy_cost: 1.0e-2
  discounting: 0.97
  unroll_length: 10
  seed: 0
  normalize_observations: true

logging_config:
  project_name: "walker-topo"
  group_name: "step1-multi-behavior"
  exp_name: "baseline"
  log_to_wandb: true

render_config:
  render_height: 480
  render_width: 640
  render_fps: 50

checkpoint:
  save_dir: "checkpoints/walker_multi_behavior"
  save_every: 40_000_000  # Save every 40M steps
