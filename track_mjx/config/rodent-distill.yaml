# =============================================================================
# Rodent Distillation Configuration
# =============================================================================
# Configuration for distilling a pretrained VNL teacher model into a student
# network. Uses behavior cloning with VAE-style latent encoding.
# =============================================================================

# =============================================================================
# Teacher Model Configuration
# =============================================================================
# Settings for the pretrained teacher model to distill from
teacher_config:
  # Path to pretrained teacher checkpoint (REQUIRED)
  checkpoint_path: /home/mila/a/aidan.sirbu/scratch/track-mjx/model_checkpoints/251207_182944_367370
  checkpoint_step: null             # Specific step to load (null = latest)

# =============================================================================
# VNL Environment Configuration
# =============================================================================
# Settings for the MuJoCo simulation environment and imitation learning task.
env_config:
  # MuJoCo backend: "jax" for GPU-accelerated simulation via MJX
  mujoco_impl: "jax"

  # -----------------------------------------------------------------------------
  # Physics Solver Settings
  # -----------------------------------------------------------------------------
  # Newton solver provides better accuracy for contact-rich scenarios
  solver: "newton"
  iterations: 5                     # Max solver iterations per step
  ls_iterations: 5                  # Line search iterations for Newton solver
  nconmax: 256                      # Max contacts (increase if contact clipping occurs)
  njmax: 128                        # Max constraint rows
  noslip_iterations: 0              # No-slip solver iterations (0 = disabled)

  # -----------------------------------------------------------------------------
  # Timing Configuration
  # -----------------------------------------------------------------------------
  sim_dt: 0.002                     # Simulation timestep (500 Hz physics)
  ctrl_dt: 0.01                     # Control timestep (100 Hz policy, = sim_dt * 5)
  mocap_hz: 50                      # Motion capture data frequency

  # -----------------------------------------------------------------------------
  # Reference Clip Settings
  # -----------------------------------------------------------------------------
  # Controls how motion capture reference clips are sampled during training
  clip_length: 250                  # Max frames per clip
  clip_set: "all"                   # Which clips to use: "all", "train", or "test"
  reference_length: 5               # Future reference frames provided to policy
  start_frame_range: [0, 50]        # Random episode start within [min, max] frames
  qvel_init: "zeros"                # Initial velocity: "zeros" or "reference"
  keep_clips_idx: null              # Specific clip indices to use (null = all)

  # -----------------------------------------------------------------------------
  # Domain Randomization Settings
  # -----------------------------------------------------------------------------
  domain_randomization:
    use_domain_randomization: false     # Disabled by default for distillation
    floor_friction: [0.4, 1.0]          # Uniform range for floor friction
    static_friction_scale: [0.9, 1.1]   # Scale for static friction coeffs
    armature_scale: [1.0, 1.05]         # Scale for joint armature values
    com_jitter: [-0.05, 0.05]           # Center of mass position jitter (m)
    link_mass_scale: [0.9, 1.1]         # Scale for link masses
    torso_mass_jitter: [-0.02, 0.02]    # Jitter for torso mass
    qpos0_jitter: [-0.05, 0.05]         # Jitter for initial joint positions

  # -----------------------------------------------------------------------------
  # Reward Terms
  # -----------------------------------------------------------------------------
  # For evaluation only - distillation doesn't use rewards for training
  # Imitation rewards computed as: weight * exp(-exp_scale * error)
  reward_terms:
    # Root (pelvis) position tracking
    root_pos:
      exp_scale: 0.035
      weight: 1.0

    # Root orientation tracking (quaternion distance)
    root_quat:
      exp_scale: 20.0
      weight: 1.0

    # Joint angle tracking
    joints:
      exp_scale: 1.41
      weight: 1.0

    # Joint velocity tracking (disabled)
    joints_vel:
      exp_scale: 1.0
      weight: 0.0

    # Body position tracking (disabled, using end effectors instead)
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0

    # End effector (feet, hands, head) position tracking
    end_eff:
      exp_scale: 0.03
      weight: 1.0

    # -------------------------------------------------------------------------
    # Regularization Costs
    # -------------------------------------------------------------------------
    # Healthy torso height range (terminates if outside)
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0

    # Penalize large control signals
    control_cost:
      weight: 0.02

    # Penalize jerky control changes between steps
    control_diff_cost:
      weight: 0.02

    # Penalize energy consumption (capped at max_value)
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # -----------------------------------------------------------------------------
  # Termination Criteria
  # -----------------------------------------------------------------------------
  # Episode ends early if any of these conditions are met
  termination_criteria:
    # Root position deviates too far from reference
    root_too_far:
      max_distance: 0.1             # meters

    # Root orientation deviates too much from reference
    root_too_rotated:
      max_degrees: 60.0

    # Overall pose error exceeds threshold
    pose_error:
      max_l2_error: 4.5

    # Terminate on NaN detection (numerical instability)
    nan_termination: {}

# =============================================================================
# Rendering Configuration
# =============================================================================
# Settings for video rendering during evaluation
render_config:
  render_camera_name: close_profile # Camera view for rendering
  render_fps: 50                    # Output video framerate
  render_interval: 1                # Render every N eval episodes

# =============================================================================
# Prior Rollout Evaluation Configuration
# =============================================================================
# Settings for evaluating the student using only the prior network (no encoder)
prior_rollout_config:
  enabled: true                     # Whether to run prior rollout evaluation
  eval_interval: 1                  # Run every N evals (1 = every eval)
  num_rollouts: 32                  # Number of rollouts to average over
  max_steps: 200                    # Maximum steps per rollout
  fixed_logvar: -2.0                # Fixed log-variance for prior sampling
  deterministic: true               # Whether to use deterministic policy
  render_best_rollout: true         # Whether to render the best rollout to wandb
  start_mode: random_clip           # Starting pose: "neutral" or "random_clip"

# =============================================================================
# Network Architecture
# =============================================================================
# Student network with VAE-style encoder/decoder and prior network
network_config:
  arch_name: intention
  encoder_layer_sizes: [512, 512, 256, 256]   # Reference trajectory encoder
  decoder_layer_sizes: [512, 512, 256, 256]   # Policy decoder
  prior_layer_sizes: [512, 512, 256, 256]     # Prior network (predicts latent from proprio)
  intention_size: 32                          # Latent intention vector dimension
  encoder_expansion_factor: 5                 # PULSE uses 5x expansion before mean/logvar heads

# =============================================================================
# Distillation Loss Configuration
# =============================================================================
# Loss weights and settings specific to distillation training
distill_config:
  action_loss_weight: 1.0           # Weight for action reconstruction loss
  autoregressive_weight: 1e-3       # Weight for AR(1) temporal smoothness of latent means
  kl_weight: 1e-3                   # Weight for KL(encoder || prior) - trains prior only (encoder has stop_grad)
  encoder_kl_weight: 1e-3           # Weight for KL(encoder || N(0,1)) - regularizes encoder
  use_l2_action_loss: false         # If true, use mean L2 norm (like PULSE). If false, use MSE.
  grad_clip_norm: 50.0              # Gradient clipping norm (PULSE uses 50.0)

  # ---------------------------------------------------------------------------
  # Log-variance Clamping
  # ---------------------------------------------------------------------------
  # PULSE uses min=-5, max=2 for both. Set to null to disable clamping.
  encoder_logvar_min: -5.0
  encoder_logvar_max: 2.0
  prior_logvar_min: -5.0
  prior_logvar_max: 2.0

  # ---------------------------------------------------------------------------
  # Loss Weight Schedule
  # ---------------------------------------------------------------------------
  # Optional schedule for annealing loss weights during training
  use_schedule: true
  schedule_params:
    kl_start_weight: 1e-2
    kl_end_weight: 1e-3
    kl_start_ramp: 0.5
    kl_end_ramp: 0.75
    ar_start_weight: 0.005
    ar_end_weight: 0.005
    ar_start_ramp: 0.0
    ar_end_ramp: 0.25
    encoder_kl_start_weight: 1e-3
    encoder_kl_end_weight: 1e-3
    encoder_kl_start_ramp: 0.0
    encoder_kl_end_ramp: 0.5

# =============================================================================
# Training Setup
# =============================================================================
train_setup:
  agent_name: rodent_distill
  run_name: distill_debug

  # Checkpointing and restoration
  checkpoint_to_restore: null       # Path to restore model weights
  restore_from_run_state: null      # Path to restore full training state

  # Data splitting
  train_test_split_info: null       # Pre-computed split (null = random)
  train_subset_ratio: 0.8           # Fraction of clips for training

  # Evaluation and resets
  eval_every: 20_000_000            # Eval frequency (env steps)
  episode_length: 200               # Max steps per episode
  reset_every: 20_000_000           # JIT recompilation frequency (memory mgmt)

  # ---------------------------------------------------------------------------
  # Distillation Training Hyperparameters
  # ---------------------------------------------------------------------------
  train_config:
    num_envs: 4096                  # Parallel environments
    num_timesteps: 2_000_000_000    # Total training steps
    batch_size: 1024                # Samples per gradient update
    num_minibatches: 16             # Minibatches per epoch
    num_updates_per_batch: 4        # Updates per batch
    learning_rate: 1e-4             # Adam learning rate
    action_repeat: 1                # Actions repeated per step
    normalize_observations: true    # Running mean/std normalization
    unroll_length: 20               # Rollout length before update
    seed: 0                         # Random seed
    deterministic_eval: true        # Use mean action during eval

# =============================================================================
# Logging Configuration
# =============================================================================
# Weights & Biases logging settings
logging_config:
  project_name: vnl_debug
  group_name: null
  exp_name: null
  clip_id: -1                       # Clip ID for single-clip runs (-1 = all)
  model_path: /home/mila/a/aidan.sirbu/scratch/track-mjx/model_checkpoints

# =============================================================================
# Walker Configuration
# =============================================================================
# Rodent morphology and actuator settings
walker_config:
  walker_name: "rodent"
  torque_actuators: true            # Use torque (vs position) control
  rescale_factor: 0.9               # Model scale factor

  # Joint names for tracking (order must match reference data)
  joint_names:
    # Spine
    - vertebra_1_extend
    # Left hind leg
    - hip_L_supinate
    - hip_L_abduct
    - hip_L_extend
    - knee_L
    - ankle_L
    - toe_L
    # Right hind leg
    - hip_R_supinate
    - hip_R_abduct
    - hip_R_extend
    - knee_R
    - ankle_R
    - toe_R
    # Neck and head
    - vertebra_C11_extend
    - vertebra_cervical_1_bend
    - vertebra_axis_twist
    - atlas
    - mandible
    # Left front leg
    - scapula_L_supinate
    - scapula_L_abduct
    - scapula_L_extend
    - shoulder_L
    - shoulder_sup_L
    - elbow_L
    - wrist_L
    # Right front leg
    - scapula_R_supinate
    - scapula_R_abduct
    - scapula_R_extend
    - shoulder_R
    - shoulder_sup_R
    - elbow_R
    - wrist_R
    - finger_R

  # Body segment names for tracking
  body_names:
    - torso
    - pelvis
    # Left hind leg
    - upper_leg_L
    - lower_leg_L
    - foot_L
    # Right hind leg
    - upper_leg_R
    - lower_leg_R
    - foot_R
    # Head
    - skull
    - jaw
    # Left front leg
    - scapula_L
    - upper_arm_L
    - lower_arm_L
    - finger_L
    # Right front leg
    - scapula_R
    - upper_arm_R
    - lower_arm_R
    - finger_R

  # End effector names for tracking (extremities)
  end_eff_names:
    - foot_L
    - foot_R
    - hand_L
    - hand_R
    - skull
