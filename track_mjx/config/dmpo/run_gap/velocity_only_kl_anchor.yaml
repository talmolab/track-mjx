# @package _global_
# DMPO + B-aggressive trainable prior + decoder + KL-in-loss anchor. The anchor
# signal flows through the policy loss as -alpha * mean(exp(-w * KL(pi_theta ||
# pi_imit))), NOT through the env reward; the critic learns over r_task only.
#
# Entry point: python scripts/train_dmpo_highlvl_kl_anchor.py --config-name=run_gap/<file name>
defaults:
  - /base
  - _self_

env_name: RodentRunGapBinocularVision
walker: rodent_no_tail_collisions

env_config:
  env_name: RodentRunGapBinocularVision
  task_name: run_gap_binocular_vision
  walker_name: rodent
  render_camera_name: close_profile
  vision: true
  vision_width: 32
  vision_height: 32
  grayscale: true
  vision_camera_name: "egocentric-rodent"
  binocular: true
  left_camera_name: "eye_left-rodent"
  right_camera_name: "eye_right-rodent"
  eye_dropout_rate: 0.0
  eval_eye_mode: "binocular"
  render_depth: false
  use_textures: true
  use_shadows: true
  flatten_obs: false
  episode_length: 1000
  action_repeat: 1
  ctrl_dt: 0.01
  sim_dt: 0.002
  solver: "newton"
  mujoco_impl: "warp"
  # naconmax bumped 32768 -> 65536 (32 contacts/env at 2048 envs). A 32768 cap
  # overflowed the broadphase at ~61740 contacts (~31/env) once behavior
  # diversified -- contact truncation in mid-air / takeoff phases would silently
  # break physics and prevent learning ballistic moves. 32/env gives ~5% headroom
  # over the observed peak.
  naconmax: 65536
  njmax: 400
  iterations: 5
  ls_iterations: 5
  noslip_iterations: 0
  torque_actuators: true
  rescale_factor: 0.9
  corridor_length: 4.0
  corridor_width: 2.0
  platform_length_range: [0.3, 0.6]
  gap_length_range: [0.03, 0.2]
  n_platforms: 20
  spawn_x: 0.5
  randomize_gaps: true
  aesthetic: "outdoor_natural"
  use_mesh_platforms: true
  reward_terms:
    forward_velocity:
      weight: 1.0
      target_speed: 0.9
    gap_crossing_bonus:
      weight: 10
  termination_criteria:
    fallen:
      min_torso_z: 0.0325
      max_torso_angle: 85
    nan_termination: {}

network_config:
  arch_name: dmpo_kl_anchor_b_aggressive
  binocular_mode: shared
  vision_feature_size: 32
  vision_channels: [4, 8, 16, 32]
  policy_head_layer_sizes: [256, 256, 256]
  value_hidden_layer_sizes: [512, 512, 512, 512]

transfer:
  mode: kl_anchor_b_aggressive
  prior_checkpoint_path: ${oc.env:DMPO_PRIOR_ROOT}/default
  prior_checkpoint_step: null
  highlvl_obs_key: task_obs
  decoder_obs_key: proprioception

kl_anchor:
  # KL-in-loss: alpha_anchor is the COEFFICIENT on the policy
  # loss term -alpha * mean(exp(-w * KL(pi_theta || pi_imit))). Higher
  # alpha = stronger pull toward the imit Gaussian distribution at the
  # PARAMETER level (not via env reward). Critic learns over r_task only.
  w_anchor: 0.5
  alpha_anchor: 1.0
  # Linear-decay schedule for `w_anchor`. When `decay_sgd_steps > 0`, w is
  # linearly interpolated from `w_anchor` (at SGD step 0) to `w_anchor_floor`
  # (at step `decay_sgd_steps`) and clamped at the floor thereafter. Defaults
  # of 0/0 keep w static at `w_anchor` for the entire run.
  w_anchor_floor: 0.0
  decay_sgd_steps: 0
  prior_lr_mult: 0.1
  decoder_lr_mult: 1.0
  policy_head_lr_mult: 1.0

train_config:
  num_envs: 2048
  num_timesteps: 1_000_000_000
  unroll_length: 50
  batch_size: 1024
  min_replay_size: 50_000
  max_replay_size: 400_000
  sequence_length: 50
  samples_per_insert: 2.0
  iters_per_chunk: 8
  log_every_steps: 1_000_000
  eval_every_steps: 10_000_000

logging_config:
  project_name: dmpo-rodent
  exp_name: dmpo-kl-anchor-b-aggressive-v0
  group_name: RodentRunGapBinocularVision-kl-anchor
  notes: "DMPO + B-aggressive trainable prior + decoder + KL-in-loss anchor. The anchor signal flows through the policy loss as -alpha * mean(exp(-w * KL(pi_theta || pi_imit))), NOT through the env reward; the critic learns over r_task only."

eval_render_config:
  fps: 50
  height: 480
  width: 640
  camera: close_profile-rodent
  episode_length: 500
  hud:
    enabled: true
    show_speed: true
    show_reward_breakdown: true
    show_cumulative_reward: true
    show_gap_crossing: true
    show_height: true
    show_heading: true
    show_step_counter: true
    show_distance_to_gap: true
    show_lateral_deviation: true
    show_action_magnitude: true
    gap_flash_duration: 1.5
