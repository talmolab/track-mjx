# =============================================================================
# Divergent Futures Experiment
# =============================================================================
# Demonstrates that D0 codes encode categorically different motor plans by
# finding clips with similar initial poses but divergent futures, then testing
# 3 decoder-only conditions: correct codes, random step-excluded, random
# trajectory-excluded.
# =============================================================================

# =============================================================================
# Checkpoint Configuration
# =============================================================================
checkpoint:
  path: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/model_checkpoints/260312_081359_853010/
  step: null

# =============================================================================
# Data Configuration
# =============================================================================
data:
  h5_path_test: ./outputs/rollout_vqvae_rvq_test.h5

# =============================================================================
# Experiment Configuration
# =============================================================================
experiment:
  K: 3
  max_steps: 500
  seed: 42
  postures: ["rearing", "walking", "grooming"]
  killer_demo:
    enabled: true
    K: 10
    anchor_z_fraction: 0.5    # 0=standing, 1=peak rear, 0.5=midway
  pose_selection:
    z_percentile: 90
    joint_distance_threshold: 1.5
    min_code_divergence: 0.7
    search_window_frames: 40
    min_rollout_length: 450
    score_percentile: 75

# =============================================================================
# Rendering Configuration
# =============================================================================
render:
  enabled: true
  fps: 50
  width: 800
  height: 600
  ghost_alpha: 0.35
  # Fixed world camera for ghost overlay (3/4 angled view)
  camera_distance: 0.8       # distance from origin
  camera_elevation: -30.0    # degrees (negative = looking down)
  camera_azimuth: 135.0      # degrees
  camera_fovy: 60.0          # vertical field of view
  killer_demo_camera_distance: 0.8  # match normal experiment camera

# =============================================================================
# WandB Configuration
# =============================================================================
wandb:
  enabled: true
  project: vqvae-eval
  entity: null

# =============================================================================
# Output Configuration
# =============================================================================
output:
  base_dir: ./outputs/divergent_futures

# =============================================================================
# Environment Configuration
# =============================================================================
env_config:
  mujoco_impl: "jax"

  solver: "newton"
  iterations: 5
  ls_iterations: 5
  nconmax: 256
  njmax: 128
  noslip_iterations: 0

  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50

  clip_length: 250
  clip_set: "all"
  reference_length: 5
  start_frame_range: [0, 50]
  qvel_init: "zeros"
  keep_clips_idx: null

  domain_randomization:
    use_domain_randomization: false
    floor_friction: [0.7, 0.7]
    static_friction_scale: [1.0, 1.0]
    armature_scale: [1.0, 1.0]
    com_jitter: [0.0, 0.0]
    link_mass_scale: [1.0, 1.0]
    torso_mass_jitter: [0.0, 0.0]
    qpos0_jitter: [0.0, 0.0]

  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.41
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0
    end_eff:
      exp_scale: 0.03
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  termination_criteria:
    root_too_far:
      max_distance: 0.15
    root_too_rotated:
      max_degrees: 75.0
    pose_error:
      max_l2_error: 5.0
    nan_termination: {}

# =============================================================================
# Walker Configuration
# =============================================================================
walker_config:
  walker_name: "rodent"
  torque_actuators: true
  rescale_factor: 0.9

  joint_names:
    - vertebra_1_extend
    - hip_L_supinate
    - hip_L_abduct
    - hip_L_extend
    - knee_L
    - ankle_L
    - toe_L
    - hip_R_supinate
    - hip_R_abduct
    - hip_R_extend
    - knee_R
    - ankle_R
    - toe_R
    - vertebra_C11_extend
    - vertebra_cervical_1_bend
    - vertebra_axis_twist
    - atlas
    - mandible
    - scapula_L_supinate
    - scapula_L_abduct
    - scapula_L_extend
    - shoulder_L
    - shoulder_sup_L
    - elbow_L
    - wrist_L
    - scapula_R_supinate
    - scapula_R_abduct
    - scapula_R_extend
    - shoulder_R
    - shoulder_sup_R
    - elbow_R
    - wrist_R
    - finger_R

  body_names:
    - torso
    - pelvis
    - upper_leg_L
    - lower_leg_L
    - foot_L
    - upper_leg_R
    - lower_leg_R
    - foot_R
    - skull
    - jaw
    - scapula_L
    - upper_arm_L
    - lower_arm_L
    - finger_L
    - scapula_R
    - upper_arm_R
    - lower_arm_R
    - finger_R

  end_eff_names:
