# @package _global_
# Gen1 prior, LARGE GAPS, MLP head: the {MLP} x {gap 0.4} cell of the head x
# gap-width 2x2. Derived from the MLP gen1 arm by the single gap_length_range
# change, so against the GRU large-gap arm the only free variable is the policy
# head, and against the MLP [0.03,0.2] arm the only free variable is gap width.
# The MLP is ~3.5x faster per env step than the GRU (40-45k vs 11.4k sps
# measured). SAME NO-TRACTION RISK as the GRU large-gap arm, and it bites harder
# here: the reward is gap_crossing_bonus only, gaps are uniform(0.03,0.4), and
# an MLP has no memory to carry a partial approach across steps. If crossings/ep
# is ~0 at 60-80M, narrow the range or add a staged curriculum; do not just
# spend more steps.
#
# DMPO variant B (kl_anchor_b_aggressive) on the corridor gap-jump task with a
# frozen imitation prior and decoder: only the policy head (binocular CNN
# encoder and head), the critic, the MPO duals and the normalizer train unless
# the arm says otherwise. The prior and decoder live INSIDE the policy network,
# so MPO's KL constraints, tanh bind and action penalty act on the 38-D motor
# action -- the range the imitation policy was trained in -- while the trainable
# head emits a latent residual; gradients reach the head THROUGH the frozen
# decoder. (The plain prior_decoder mode would instead make the 16-D latent
# residual the agent's action space, where every action-space-dependent MPO
# hyperparameter of the base config, pinned to 38-D motor-space values, is
# wrong, and the action penalty -||a|| literally optimises for "reproduce the
# prior".) Freezing is prior_lr_mult = decoder_lr_mult = 0.0: adam(0.0) emits
# updates of exactly -0.0, so those subtrees are bit-identical for the whole run
# and no code change is needed.
#
# Entry point: python scripts/train_dmpo_highlvl_kl_anchor.py --config-name=run_gap/<file name>
defaults:
  - /base
  - _self_

env_name: RodentRunGapBinocularVision
walker: rodent_no_tail_collisions

env_config:
  env_name: RodentRunGapBinocularVision
  task_name: run_gap_binocular_vision
  walker_name: rodent
  render_camera_name: close_profile
  vision: true
  vision_width: 32
  vision_height: 32
  grayscale: true
  vision_camera_name: "egocentric-rodent"
  binocular: true
  left_camera_name: "eye_left-rodent"
  right_camera_name: "eye_right-rodent"
  eye_dropout_rate: 0.0
  eval_eye_mode: "binocular"
  render_depth: false
  use_textures: true
  use_shadows: true
  flatten_obs: false
  episode_length: 1000
  action_repeat: 1
  ctrl_dt: 0.01
  sim_dt: 0.002
  solver: "newton"
  mujoco_impl: "warp"
  # naconmax bumped 32768 -> 65536 (32 contacts/env at 2048 envs). A 32768 cap
  # overflowed the broadphase at ~61740 contacts (~31/env) once behaviour
  # diversified; contact truncation in mid-air / takeoff phases silently breaks
  # physics and would prevent learning ballistic moves.
  naconmax: 65536
  njmax: 400
  iterations: 5
  ls_iterations: 5
  noslip_iterations: 0
  torque_actuators: true
  rescale_factor: 0.9
  corridor_length: 4.0
  corridor_width: 2.0
  platform_length_range: [0.3, 0.6]
  # LARGE GAPS: 0.2 -> 0.4, the same change as the GRU large-gap arm. Note
  # run_gap.py uses gap_length_range[1] as the platform REFERENCE SPACING
  # (max_cumulative = n_platforms * (max - min) = 20 * 0.37), so the arena
  # geometry differs from the [0.03,0.2] arms -- not just the sampling.
  gap_length_range: [0.03, 0.4]
  n_platforms: 20
  spawn_x: 0.5
  randomize_gaps: true
  aesthetic: "outdoor_natural"
  use_mesh_platforms: true
  # SPARSE REGIME. forward_velocity is removed; the only reward is a +1 the step
  # the agent clears a new gap. `weight: 1.0` is deliberate -- it makes the
  # undiscounted episode return literally "gaps crossed", so
  # `batch/mean_episode_reward` and `batch/gap_crossings_per_episode` are the same
  # quantity and disagree only if something is miswired.
  #
  # The bonus cannot be farmed: run_gap.py keeps a high-water mark
  # (`gaps_crossed = max(new, old)`), so rocking backward and forward over one
  # boundary pays once. It does not fire spuriously at spawn either: counting the
  # platforms already behind spawn_x=0.5 would give >= 1.0 crossings per episode
  # from step 1, while the early crossing rate is ~0.04.
  reward_terms:
    gap_crossing_bonus:
      weight: 1.0
  termination_criteria:
    fallen:
      min_torso_z: 0.0325
      max_torso_angle: 85
    nan_termination: {}

network_config:
  arch_name: dmpo_kl_anchor_b_aggressive
  binocular_mode: shared
  critic_use_proprio: true
  # ---- latent residual bound -------------------------------------------------
  # The frozen decoder must only be evaluated inside its training domain, so the
  # policy's displacement of the prior's latent is bounded rather than free. An
  # unbounded residual drove z hundreds of sigma (Mahalanobis) off the prior
  # manifold, with the decoder evaluated far outside its training domain.
  #
  # residual_mode:
  #   "none"        unbounded residual -- kept only to reproduce that failure.
  #   "tanh"        isotropic, scale in raw units (the PPO wrapper's behaviour).
  #   "sigma_tanh"  z = prior_mean + residual_scale * sigma_prior(s) * tanh(raw).
  #                 The imitation decoder was trained on z = mu(s) + sigma(s)*eps,
  #                 eps ~ N(0,I), and the prior's logvar is fit by KL to that same
  #                 encoder posterior, so `residual_scale * tanh(raw)` IS eps
  #                 restricted to (-k, k): in-distribution by construction and
  #                 correctly anisotropic, unlike a fixed +-1 box (the latent's
  #                 per-dim scale is ~0.83 sigma and varies 12x across dims).
  #                 k=2 covers 95.4% of the noise the decoder saw.
  #   "sigma_ball"  constrains the JOINT radius ||eps|| <= r instead of each dim,
  #                 which stops the policy exploiting the corners of the per-dim
  #                 box (per-dim |eps| sits on the ceiling while ||eps|| exceeds
  #                 the training radius). r is read off chi^2_16: 4.00 = median
  #                 training radius, 5.13 = 95th percentile, 5.66 = 99th.
  residual_mode: sigma_ball
  residual_scale: 5.0
  vision_feature_size: 32
  vision_channels: [4, 8, 16, 32]
  # Recurrent policy head. REPLACES policy_head_layer_sizes [256,256,256] (which
  # is unread on the RNN path, so it is absent here). The head is CNN + task_obs
  # + proprio -> Dense(256)+LayerNorm+silu (mlp_layers) -> GRU(256)
  # (hidden_sizes) -> zero-init residual Dense; the zero-init keeps the step-0
  # warm-start invariant (anchor_invariant_probe r_anchor=1.0000) for ANY hidden
  # state. store_dtype float16 is the REPLAY dtype for the stored per-step hidden
  # (512 B/transition); the live hidden runs f32 end to end.
  # MLP variant: a feedforward policy head ([256,256,256]) replaces the
  # policy_head_rnn GRU block of the recurrent arm.
  policy_head_layer_sizes: [256, 256, 256]
  value_hidden_layer_sizes: [512, 512, 512, 512]
  # prior_layer_sizes / decoder_layer_sizes / intention_size are NOT set here --
  # train_dmpo_highlvl_kl_anchor.py reads them from the prior checkpoint's own
  # config, so the spliced param tree always matches.
  # For 260407_183223_056788 those are:
  #   intention_size=16  prior=[1536,1024,512]  decoder=[512,512,512,256,256]
  #   action_size=38     obs={imitation_target:640, proprioception:277}

transfer:
  mode: kl_anchor_b_aggressive
  # The "combined" prior, distilled over clip_set=all of the reference clips.
  prior_checkpoint_path: ${oc.env:DMPO_PRIOR_ROOT}/260827_153154_576196  # gen1 prior
  # NO warm start -- doubly mandatory here: (a) this arm is
  # pure-sparse-from-scratch; (b) an FF policy tree CANNOT be grafted into the
  # recurrent one (the entry point raises a ValueError if this is set with
  # policy_head_rnn).
  warm_start_dmpo_checkpoint: null
  prior_checkpoint_step: 24  # gen1 prior latest step
  highlvl_obs_key: task_obs
  decoder_obs_key: proprioception

kl_anchor:
  # 1e-6, not 0.0: the learner gates the whole anchor branch on
  # `if cfg.kl_anchor_alpha != 0.0` (a trace-time Python branch), so alpha=0
  # would pin anchor_kl_mean / anchor_reward_mean at 0 for the entire run and
  # lose the ONLY continuous measure of how far z has drifted from
  # the frozen prior. 1e-6 against a policy loss of ~5 is 7 orders down, so
  # the gradient contribution is negligible while the diagnostic stays alive.
  # Caveat when reading it: the wrapper recomputes pi_imit under its own
  # normalizer, so anchor_kl also charges for DMPO normalizer drift -- read it
  # as "policy moved OR normalizer moved", not as a pure residual measure.
  alpha_anchor: 1.0e-6
  w_anchor: 0.5
  w_anchor_floor: 0.0
  decay_sgd_steps: 0
  # Freeze the combined prior and the decoder; the trainable block is the
  # recurrent policy head (includes the binocular CNN encoder + GRU).
  prior_lr_mult: 0.0
  decoder_lr_mult: 0.0
  policy_head_lr_mult: 1.0

train_config:
  num_envs: 2048
  # Budget: 500M env steps, which extends an initial 300M stop. This is safe to
  # edit mid-run: the DMPO trainer resumes off checkpoint_dir contents, NOT the
  # run_state config hash, and the entry point sets start_env_steps from
  # ckpt_mgr.latest_step(), so num_timesteps is a TOTAL target -- relaunching
  # after the 300M stop continues to 500M rather than training 500M more.
  num_timesteps: 500_000_000
  unroll_length: 50
  # batch_size 1024 -> 256. With the [B, L] loss points folded into the batch,
  # every learner intermediate scales with B*L: at B=1024 that is 20,480 loss
  # points -- 20x the FF path's batch -- and smoke runs OOMed (8.96 then 7.19 GiB
  # allocations; the sequential-map fix for the E-step/bootstrap cuts forward
  # peaks but cannot cut BACKWARD storage for the critic-loss grad and the BPTT
  # unroll). B=256 divides all of it by 4: B*L = 5,120 loss points/update, and
  # K=10 x 256 x L=20 = 51,200 loss-state visits per rollout = EXACTLY the FF
  # baseline's K=50 x 1024 revisit rate.
  batch_size: 512
  min_replay_size: 50_000
  # Replay depth under the fatter transition. The f16 GRU-256 hidden adds 512 B:
  # 3.75 -> 4.25 KB/transition (+13.3%; verify against the startup "Replay
  # transition size" line). 2,355,200 = 1150 steps/env x 2048 envs = 23.0
  # rollouts (~51 s) of history, the same time-depth as the feedforward baseline's
  # replay, at 4.25 KB/transition => 10.0 GB. Valid window starts per env:
  # 1150 - 120 + 1 = 1031. Usable memory is bounded by buffer + full-leaf
  # transients: 30 rollouts (3,072,000) fails XLA autotuning on rb.add's per-leaf
  # transpose transient (f32[2048,1500,277] = 3.4 GB scratch), so ~85% of device
  # memory is the practical ceiling.
  max_replay_size: 2_355_200
  # L + n = 20 + 100. The entry point RAISES unless sequence_length ==
  # rnn_bptt_length + n_step: every loss point t < L needs a full n-step reward
  # window plus the bootstrap state (and its stored hidden) at observation[:, t + n].
  # 120 -> 101: sequence_length == rnn_bptt_length + n_step, and with
  # rnn_bptt_length=0 that is n_step + 1 = 101.
  sequence_length: 101
  samples_per_insert: 2.0
  # K 50 -> 10. Each recurrent update costs ~L x the FF E-step
  # (num_samples=20 critic-CNN applies PER loss point: 20 x 1024 x 20 ~ 410k
  # critic forwards/update at L=20). K=10 holds per-rollout loss-point
  # visits to 10 x 1024 x 20 = 204,800 = 4x the FF baseline's 51,200 at ~4x
  # the SGD FLOPs -- reuse per rare rewarding transition goes UP while
  # wall-clock stays bounded. Reserve lever (not used here): split the critic
  # into encode(obs)/head(emb, a) so the 20 samples share one CNN embedding.
  sgd_steps_per_rollout: 50
  # BPTT unroll depth L = the MEMORY horizon (~200 ms at 100 Hz), not the reward
  # horizon (n_step stays 100). >0 switches the learner to the R2D2-style
  # stored-state + short-BPTT path; requires the recurrent head (policy_head_rnn
  # above), use_n_step=true and the compressed schema -- the entry point raises on
  # any mismatch.
  # 0 disables the R2D2 stored-state/short-BPTT learner path. >0 REQUIRES
  # the recurrent head, so this must be 0 for the FF head above --
  # the entry point raises on any mismatch.
  rnn_bptt_length: 0
  iters_per_chunk: 8
  log_every_steps: 1_000_000
  eval_every_steps: 10_000_000

  # ---- MPO overrides of the base config -------------------------------------
  # The MO-MPO action penalty is `-||a||` over ALL action magnitudes, not just
  # the out-of-bound part as in Acme. Its normalized weights are ADDED to the MPO
  # weights, so ~half the cross-entropy weight mass pushes actions toward zero --
  # directly anti-correlated with the large-amplitude torques a gap jump needs.
  use_n_step: true
  # n_step stays 100 -- the reward horizon is untouched by the RNN package
  # (see rnn_bptt_length above for why the two horizons are different knobs).
  n_step: 100
  min_log_temperature: -7.0
  # ---- Compressed replay (see DMPOConfig) --------------------------------
  # next_observation dropped (observation[:, t+n] bootstraps -- with the
  # recurrent learner this is REQUIRED, not optional) and vision stored uint8
  # (renderer unpacks 8-bit channels; error <=1/510). Sizing under the +512 B
  # hidden: see max_replay_size above.
  store_next_observation: false
  vision_uint8_storage: true
  # No warm-start machinery: cold critic, no critic-only gate.
  critic_warmup_sgd_steps: 0
  # forward_velocity was deleted from reward_terms, so the env total already
  # IS the sparse bonus: no anneal, stored == env reward.
  reward_anneal_sparse_key: null
  reward_anneal_env_steps: 0
  # No behavior mixing -- and additionally unsupported with a recurrent
  # policy (v1); the entry point raises if > 0 with policy_head_rnn.
  behavior_mix_init: 0.0
  behavior_mix_hold_env_steps: 0
  behavior_mix_end_env_steps: 0
  # Cold start: base default. The warm-start recipe's +1.0 was justified BY its
  # warm start, a premise that does not hold here.
  init_log_temperature: 10.0

  # ---- gamma: 0.97 -> 0.995 --------------------------------------------------
  # gamma IS a speed prior, which is exactly what the sparse regime removes. It
  # discounts a later crossing relative to an earlier one, so a small gamma
  # smuggles "hurry up" back into a reward that no longer says it.
  #
  # Numerically, at the dense reference's measured pace of one crossing per 73.6
  # steps:
  #     gamma   horizon   Q(crosses forever)   Q(crosses once, then falls)
  #     0.97     0.33 s        1.119                    1.0
  #     0.99     1.00 s        1.913                    1.0
  #     0.995    2.00 s        3.242                    1.0
  # At 0.97 the critic can barely separate a rat that runs the whole corridor
  # from one that clears a single gap and dies -- 12% of value. At 0.995 it is
  # 224%. Q is MPO's ENTIRE policy-improvement signal, so that separation is the
  # experiment.
  #
  # KNOWN BIAS, accepted: the rollout stores discount = 1 - done, and brax's
  # EpisodeWrapper folds the 1000-step time limit into `done`, so truncation is
  # bootstrapped as if terminal. At gamma=0.995 that touches the last ~200 steps
  # (20%). Tolerable because the bias is ~state-additive and MPO's E-step is a
  # softmax over actions AT THE SAME STATE, where an additive term cancels. It
  # still costs critic fit quality. The proper fix is to bootstrap on truncation,
  # but note `_alive = cumprod(discount)` is what stops post-autoreset rewards
  # leaking into R_n, so it needs two masks.
  discount: 0.995

  # ---- C51 support: [0,50]x201 (kept at the warm-start recipes' values) ------
  # Support brackets the historical MIXED return; with the dense term gone
  # vmax 50 is slack (nothing can exceed 20 undiscounted), which wastes atoms
  # but cannot bias the mean the E-step reads. Kept for comparability with the
  # warm-start recipes; 201 atoms -> delta=0.25 are known to fit in memory (501
  # atoms are not).
  vmin: 0.0
  vmax: 50.0
  num_atoms: 201
  action_penalization: false
  # softplus(1000) ~= 1000 makes the stddev-KL Lagrange multiplier enormous at
  # init, so the policy cannot widen. Start it small instead.
  init_log_alpha_stddev: 1.0
  # 1e-7 freezes the stddev update budget outright.
  epsilon_stddev: 1.0e-3

logging_config:
  project_name: dmpo-rodent
  exp_name: arm_gen1_prior_gap04_mlp
  group_name: RodentRunGapBinocularVision-frozen-prior
  notes: "Gen1 prior, LARGE GAPS, MLP head: the {MLP} x {gap 0.4} cell of the head x gap-width 2x2. Derived from the MLP gen1 arm by the single gap_length_range change, so against the GRU large-gap arm the only free variable is the policy head, and against the MLP [0.03,0.2] arm the only free variable is gap width. The MLP is ~3.5x faster per env step than the GRU (40-45k vs 11.4k sps measured). SAME NO-TRACTION RISK as the GRU large-gap arm, and it bites harder here: the reward is gap_crossing_bonus only, gaps are uniform(0.03,0.4), and an MLP has no memory to carry a partial approach across steps."

wrappers:
  info_reset_on_done: true

# Anchored at DMPO_CKPT_ROOT (default ./dmpo_checkpoints). Set DMPO_CKPT_ROOT to
# an absolute path: a relative path resolves against the launch directory, so a
# launch from the wrong directory writes to an empty dir, finds 0 checkpoint
# steps, skips auto-resume and exits early.
# Must also be a fresh dir for a recurrent head: restoring an FF run's
# checkpoints into the recurrent param tree fails (the entry point wraps that
# failure in a pointed error).
checkpoint_dir: ${oc.env:DMPO_CKPT_ROOT,dmpo_checkpoints}/arm_gen1_prior_gap04_mlp

eval_render_config:
  # 50 fps against a 100 Hz control rate (ctrl_dt: 0.01) = deliberate HALF-SPEED
  # playback. With policy_head_rnn the eval rollout threads the hidden
  # through run_eval_rollout_envzero (zeros-init at eval start, zeroed where
  # done), so this block is live from the first eval.
  fps: 50
  height: 480
  width: 640
  camera: close_profile-rodent
  episode_length: 1000
  hud:
    enabled: true
    show_speed: true
    show_reward_breakdown: true
    show_cumulative_reward: true
    show_gap_crossing: true
    show_height: true
    show_heading: true
    show_step_counter: true
    show_distance_to_gap: true
    show_lateral_deviation: true
    show_action_magnitude: true
    gap_flash_duration: 1.5
