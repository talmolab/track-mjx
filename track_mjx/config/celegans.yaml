# defaults:
#   - override hydra/launcher: submitit_slurm

reference_config:
  data_path: /home/aaprasad/mnt/projects/con3trol/run/results/stac/celegans_ik_only_04182019am_centerline_0-500_2d_scale-0.1.h5
  clip_length: 250
  test_ratio: 0.2

render_config:
  render_camera_name: track
  render_fps: 20
  render_interval: 1

env_config:
  env_name: WormImitation
  torque_actuators: False  # Changed from False for better performance
  rescale_factor: 1.001
  dim: 2
  trans_joint: "slide"
  friction: 
    tan_floor: 0.7
    tan_body: 0.6
    tor: 0.005
    roll_floor: 0.0001
    roll_body: 0.0001
  solimp: 
    d0: 0.0
    dwidth: 0.95
    width: 0.001
    midpoint: 0.5
    power: 2
  impratio: 0.4
  muscle_config:
    dynprm:
      tausmooth: 0.0
    gainprm:
      force: 0.2
  joint_config:
    hinge:
      damping: 0
      armature: 1e-6
  proprioceptive_filter: []
  root_body: torso13_body
  end_effectors: ["torso1_body", "torso25_body"]
  solver: "cg"
  integrator: "rk4"
  iterations: 4
  ls_iterations: 4
  ctrl_dt: 0.1
  sim_dt: 0.01

  mocap_hz: 20
  reference_length: 5
  start_frame_range: [0, 50]
  mujoco_impl: jax
  init_pos:
    x: 0.0
    y: 0.0
    z: 5e-3
    

  reward_terms:
    upright: 
      healthy_z_range: [0.0, 1.0]
      weight: 0.0
    root_pos:
      exp_scale: 0.01
      weight: 1.0
    root_quat:
      exp_scale: 30
      weight: 1.0
    joints:
      exp_scale: 1.0
      weight: 2.0 #2.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0 #3.0
    bodies_pos:
      exp_scale: 0.05
      weight: 0.0
    end_eff:
      exp_scale: 0.01
      weight: 1.0
  cost_terms:
    control:
      weight: 0.02
    control_diff:
      weight: 0.02
    energy:
      max_value: 50.0
      weight: 0.0
  domain_randomization:
    use_domain_randomization: False

  termination_criteria:
    fall:
      healthy_z_range: [-1.0, 1.0]
    root_too_far:
      max_distance: 0.01
    root_too_rotated:
      max_degrees: 60.0
    pose_error:
      max_l2_error: 4.5
      
  


network_config:
  arch_name: intention
  action_distribution: sigmoid
  encoder_layer_sizes: [512,512,512]
  decoder_layer_sizes: [512,512,512]
  critic_layer_sizes: [512,512,512]
  intention_size: 8
  kl_schedule: True # Whether to use a ramping KL schedule
  latent_kl_weight: 1e-4 # The maximum weight if schedule is True
  latent_ar1_weight: 0.0 # The maximum weight if schedule is True
  hidden_state_size: 512
  hidden_layer_num: 3

train_setup:
  agent_name: celegans
  run_name: imitation_init_run
  restore_from_run_state:
  checkpoint_to_restore:
  train_test_split_info: # "data/train_test_split_rodent.json" # Path to the train/test split file, records the index
  # Ratio of training data of the whole training dataset. Needs to be in the train_test_split_info["train_subset"] key. 
  # If not, please run the `notebooks/sample_efficiency_dev.ipynb` notebook to generate the train/test split file.
  train_subset_ratio: 0.8
  eval_every: 50_000_000
  episode_length: 200
  reset_every: 50_000_000
  freeze_decoder: False
  train_config:
    num_envs: 8192
    num_timesteps: 1_500_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 1e-4
    clipping_epsilon: 0.2     
    discounting: 0.95
    action_repeat: 1
    entropy_cost: 2e-3
    reward_scaling: 1
    normalize_observations: True
    unroll_length: 20
    seed: 0
    get_activation: False
    deterministic_eval: True

logging_config:
  project_name: con3trol
  group_name: misc
  model_path: model_checkpoints
  notes: "test vnl playground implementation"
  algo_name: ppo
  exp_name: test_vnl_playground
  rollout_metrics:
    - rewards/root_pos
    - rewards/root_quat
    - rewards/joints
    - rewards/joints_vel
    - rewards/bodies_pos
    - rewards/end_eff
    - rewards/upright
    - costs/control
    - costs/control_diff
    - costs/energy
    - terminations/fall
    - terminations/root_too_far
    - terminations/pose_error
    - terminations/root_too_rotated
    - distances/root_pos
    - distances/root_quat
    - distances/joints
    - distances/joints_vel
    - distances/bodies_pos
    - distances/end_eff
    - magnitudes/control
    - magnitudes/control_diff
    - magnitudes/energy