# track_mjx/config/latent_mimic_phase2.yaml
# Phase 2: latent-mimic style policy. Uses mujoco_warp backend (mujoco_impl=warp,
# newton solver) inherited from rodent-full-clips — the canonical warp-style
# config that has env_name + naconmax set correctly.

defaults:
  - rodent-full-clips               # picks up mujoco_impl=warp, naconmax=24576, etc.
  - _self_

# --- override env: drop imitation reward terms; reward comes from r_mimic wrapper ---
env_config:
  reward_terms: {}                  # paper Stage 1: only r_mimic from wrapper
  njmax: 800                        # parent's 400 hits 'nefc overflow' under contact-heavy
                                    # rollouts when 1024+ envs run in parallel; bump headroom
  termination_criteria:
    nan_termination: {}
    root_too_far:
      max_distance: 0.3             # slightly looser than parent's 0.1
    pose_error:
      max_l2_error: 6.0
  domain_randomization:
    # Domain randomization is OFF for v1: BraxDomainRandomizationVmapWrapper
    # bypasses our wrapper via .unwrapped. Re-enable once our wrapper provides
    # a transparent _mjx_model passthrough to the inner env.
    use_domain_randomization: false

# --- LatentMimic-specific settings ---
latent_mimic:
  # Path to a Phase-1 best ckpt directory (encoder.msgpack + predictor.msgpack
  # + normalizer.npz + config.yaml). Use the v8 conv1d/no-qvel ckpt by default.
  prior_dir: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_prior_v8/best
  w_r: 0.01                         # paper §III-D.1 scaling weight
  history_len: 5                    # H frames of (q, qdot, prev_action) in o_history
  n_joints: 67                      # full rodent skeleton; matches v8 prior

# --- networks ---
network_config:
  arch_name: latent_mimic
  policy_layer_sizes: [512, 256, 128]
  value_layer_sizes: [512, 256, 128]

# --- PPO training (override v1_warp's intention-specific settings) ---
train_setup:
  agent_name: rodent
  run_name: phase2_latent_mimic_v1
  checkpoint_to_restore: null
  restore_from_run_state: null
  train_test_split_info: null
  train_subset_ratio: 0.8
  eval_every: 5_000_000
  episode_length: 200
  reset_every: 10_000_000
  freeze_decoder: false
  train_config:
    num_envs: 2048
    num_timesteps: 500_000_000      # smaller than v1_warp's 3B for first run
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 1.0e-4
    lr_schedule: constant
    lr_end_value: 0.0
    lr_warmup_frac: 0.0
    clipping_epsilon: 0.2
    discounting: 0.95
    action_repeat: 1
    entropy_cost: 1.0e-2
    vf_loss_coefficient: 0.25
    reward_scaling: 1
    normalize_observations: true
    unroll_length: 20
    seed: 0
    get_activation: false
    deterministic_eval: true

# --- logging ---
logging_config:
  project_name: latent-mimic
  group_name: phase2
  exp_name: rodent_v8_prior
  clip_id: -1
  model_path: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_phase2_v1

# Where to save the trained "style policy" pi_style for Phase 3
checkpoint_dir: ${oc.env:HOME}/Desktop/SalkResearch/track-mjx/checkpoints/latent_phase2_v1
