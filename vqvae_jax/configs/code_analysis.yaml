# =============================================================================
# VQ-VAE Code Analysis Configuration
# =============================================================================
# Pipeline for analyzing VQ-VAE code semantics through transition analysis,
# segment extraction, kinematic correlation, and DTW alignment.
# =============================================================================

# =============================================================================
# Checkpoint Configuration
# =============================================================================
checkpoint:
  path: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/model_checkpoints/260125_202945_718947/
  step: null  # null = latest step

# =============================================================================
# Inference Configuration
# =============================================================================
inference:
  num_clips: 500        # Number of clips to run inference on
  seed: 42              # Random seed for reproducibility
  max_steps: 499        # Maximum steps per clip
  clip_length: 499      # Frames per reference clip
  cache_results: true   # Whether to cache inference results
  force_rerun: false    # Force re-run even if cache exists

# =============================================================================
# Experiment Configuration
# =============================================================================
experiments:
  # Transition matrix and chain analysis
  transition:
    enabled: true
    min_chain_prob: 0.01    # Minimum probability for chain detection
    top_k_chains: 100        # Number of top chains to report

  # Segment grid visualization (per-code videos)
  segment_grid:
    enabled: true
    max_segments_per_code: 5   # Max segments per code video
    min_segment_frames: 20      # Minimum frames for segment inclusion
    cell_width: 200             # Width of each segment cell
    cell_height: 150            # Height of each segment cell

  # Duration statistics
  duration:
    enabled: true
    transient_threshold_frames: 5   # Frames below this are "transient"

  # Kinematic feature analysis
  kinematic:
    enabled: true
    features:
      - linear_velocity
      - angular_velocity
      - body_height
      - joint_velocities
    clustering_method: umap    # "pca" or "umap"

  # DTW alignment analysis
  alignment:
    enabled: true
    max_pairs_per_code: 5       # Max aligned segments per code
    min_segment_length: 20      # Minimum frames for alignment
    dtw_feature: qpos           # Feature for DTW ("qpos" or "qvel")

# =============================================================================
# Rendering Configuration
# =============================================================================
render:
  camera: close_profile     # Camera name (suffix will be added)
  fps: 50                   # Frames per second for videos

# =============================================================================
# Output Configuration
# =============================================================================
output:
  base_dir: ./outputs/code_analysis

# =============================================================================
# Environment Configuration
# =============================================================================
env_config:
  mujoco_impl: "jax"

  # Physics Solver Settings
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  nconmax: 256
  njmax: 128
  noslip_iterations: 0

  # Timing Configuration
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50

  # Reference Clip Settings
  clip_length: 250
  clip_set: "all"
  reference_length: 5
  start_frame_range: [0, 50]
  qvel_init: "zeros"
  keep_clips_idx: null

  # Domain Randomization (disabled for analysis)
  domain_randomization:
    use_domain_randomization: false
    floor_friction: [0.7, 0.7]
    static_friction_scale: [1.0, 1.0]
    armature_scale: [1.0, 1.0]
    com_jitter: [0.0, 0.0]
    link_mass_scale: [1.0, 1.0]
    torso_mass_jitter: [0.0, 0.0]
    qpos0_jitter: [0.0, 0.0]

  # Reward Terms
  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.41
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0
    end_eff:
      exp_scale: 0.03
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # Termination Criteria
  termination_criteria:
    root_too_far:
      max_distance: 0.15
    root_too_rotated:
      max_degrees: 75.0
    pose_error:
      max_l2_error: 5.0
    nan_termination: {}

# =============================================================================
# Walker Configuration
# =============================================================================
walker_config:
  walker_name: "rodent"
  torque_actuators: true
  rescale_factor: 0.9

  joint_names:
    - vertebra_1_extend
    - hip_L_supinate
    - hip_L_abduct
    - hip_L_extend
    - knee_L
    - ankle_L
    - toe_L
    - hip_R_supinate
    - hip_R_abduct
    - hip_R_extend
    - knee_R
    - ankle_R
    - toe_R
    - vertebra_C11_extend
    - vertebra_cervical_1_bend
    - vertebra_axis_twist
    - atlas
    - mandible
    - scapula_L_supinate
    - scapula_L_abduct
    - scapula_L_extend
    - shoulder_L
    - shoulder_sup_L
    - elbow_L
