# =============================================================================
# VQ-VAE Per-Clip Analysis Configuration
# =============================================================================
# Pipeline for analyzing VQ-VAE code patterns on a per-clip basis:
# - Transition matrices and probability heatmaps per clip
# - Community detection via spectral clustering per clip
# - Interactive HTML viewer with slider navigation
# - Video rendering with code/community timeline overlays
# =============================================================================

# =============================================================================
# Checkpoint Configuration
# =============================================================================
checkpoint:
  path: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/model_checkpoints/260202_201705_679577/
  step: null  # null = latest step

# =============================================================================
# WandB Configuration
# =============================================================================
wandb:
  enabled: true          # Enable WandB logging for analysis session
  project: "vqvae-analysis"
  entity: null            # WandB entity (team or username)

# =============================================================================
# Data Source Configuration
# =============================================================================
# Analysis loads pre-computed rollout data from H5 files.
# Use `python -m inference.run_inference` to generate H5 files.
data:
  h5_path: ./outputs/rollout_64.h5  # Path to H5 file with rollout data (required)
  clip_length: 500               # Frames per clip (for environment setup)

# =============================================================================
# Per-Clip Analysis Configuration
# =============================================================================
# All analysis is done per-clip: transition matrices, community detection,
# transition graphs, and video rendering with code/community overlays.
per_clip:
  num_clips: 5                 # Number of clips to analyze
  n_communities: null           # Communities per clip (null = auto-detect)
  render_videos: false           # Render videos with code/community bars

# =============================================================================
# Transition Context Analysis Configuration
# =============================================================================
# Analyze whether top K codes serve the same function across different clips
# by comparing their transition contexts (predecessor/successor distributions).
transition_context:
  enabled: false                 # Enable transition context analysis
  top_k: 5                     # Number of top codes to analyze
  min_clips: 3                  # Minimum clips a code must appear in
  render_videos: true           # Render transition videos (pred → code → succ)
  max_videos_per_code: 4        # Maximum videos per code
  conditional:
    enabled: true               # Enable qpos-conditioned transition analysis
    qpos_threshold: 0.05        # Mean absolute difference threshold (radians)
    max_videos: 4               # Maximum comparison videos per code (deprecated)
    max_matched_videos: 4       # Videos with matching transitions
    max_unmatched_videos: 4     # Videos with different transitions
    match_window_size: 10        # Number of future frames to compare for matched/unmatched

  # Popular code pose gallery - render where each popular code starts across clips
  pose_gallery:
    enabled: false               # Enable pose gallery rendering
    top_k_codes: 5              # Number of popular codes to visualize
    videos_per_code: 4          # Clips to sample per code
    context_frames: 15          # Frames before/after code start

# =============================================================================
# Community Detection Configuration
# =============================================================================
# Settings for spectral clustering of codes into behavioral communities.
# Uses cosine similarity of transition probability rows as affinity.
community_detection:
  min_frequency: 0.005          # Minimum code frequency (0.1%). Codes below are filtered.

# =============================================================================
# Conditioned Community Analysis Configuration
# =============================================================================
# Analyze pose-conditioned transition patterns by:
# 1. Sample random seed clips
# 2. Match clips with similar starting pose (qpos[0])
# 3. Pool code sequences and build transition matrix
# 4. Run community detection on pooled transitions
# 5. Render community gallery videos per detected community
conditioned_community:
  enabled: false                  # Enable conditioned community analysis
  n_seed_clips: 10              # Number of random seed clips to sample
  qpos_threshold: 0.05          # Mean absolute difference threshold for qpos matching
  render_videos: true           # Render community gallery videos
  samples_per_community: 4      # Video segments per community
  segment_length: 30            # Frames per segment

# =============================================================================
# Community Gallery Configuration
# =============================================================================
# Render grid videos showing sample segments from each detected community.
# Each community gets a video with N sample segments showing codes from that community.
community_gallery:
  enabled: false                 # Enable community gallery rendering
  samples_per_community: 6      # Number of sample segments per community
  segment_length: 50            # Frames per segment
  min_segment_gap: 10           # Minimum frames between sampled segments

# =============================================================================
# Mutual Information Analysis Configuration
# =============================================================================
# Quantifies which behavioral features are most encoded by the codebook.
# Uses the KSG estimator (Kraskov-Stögbauer-Grassberger) for MI computation.
mutual_information:
  enabled: true
  n_neighbors: 5                # KSG estimator k-neighbors
  min_mi_threshold: 0.05        # Minimum MI (nats) to include in heatmap
  top_k_features: 8             # Max features to show in heatmap
  posture_pcs: 3                # Number of posture PCA components

# =============================================================================
# Code Determinism Analysis Configuration
# =============================================================================
# Tests whether same body state produces the same code across different clips.
# Samples random cross-clip frame pairs, bins by qpos distance, plots agreement.
determinism:
  enabled: true
  n_sample_pairs: 1000000        # Random frame pairs to sample
  n_bins: 50                     # Distance histogram bins

# =============================================================================
# Rendering Configuration
# =============================================================================
render:
  camera: close_profile     # Camera name (suffix will be added)
  fps: 50                   # Frames per second for videos
  width: 640                # Video width (high resolution)
  height: 480               # Video height (high resolution)

# =============================================================================
# Output Configuration
# =============================================================================
output:
  base_dir: ./outputs/code_analysis

# =============================================================================
# Environment Configuration
# =============================================================================
env_config:
  mujoco_impl: "jax"

  # Physics Solver Settings
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  nconmax: 256
  njmax: 128
  noslip_iterations: 0

  # Timing Configuration
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50

  # Reference Clip Settings
  clip_length: 250
  clip_set: "all"
  reference_length: 5
  start_frame_range: [0, 50]
  qvel_init: "zeros"
  keep_clips_idx: null

  # Domain Randomization (disabled for analysis)
  domain_randomization:
    use_domain_randomization: false
    floor_friction: [0.7, 0.7]
    static_friction_scale: [1.0, 1.0]
    armature_scale: [1.0, 1.0]
    com_jitter: [0.0, 0.0]
    link_mass_scale: [1.0, 1.0]
    torso_mass_jitter: [0.0, 0.0]
    qpos0_jitter: [0.0, 0.0]

  # Reward Terms
  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.41
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0
    end_eff:
      exp_scale: 0.03
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # Termination Criteria
  termination_criteria:
    root_too_far:
      max_distance: 0.15
    root_too_rotated:
      max_degrees: 75.0
    pose_error:
      max_l2_error: 5.0
    nan_termination: {}

# =============================================================================
