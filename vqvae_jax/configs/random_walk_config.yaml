# =============================================================================
# Random Walk Generation Configuration
# =============================================================================
# Configuration for random walk motion generation:
#   1. Random walk on transition probabilities to sample code sequence
#   2. Free-running decoder execution with real proprioceptive feedback
#
# Prerequisites:
#   - Run analysis to build transition matrix first:
#     python -m analysis.analyze --mode transitions
#
# Usage:
#   python -m analysis.random_walk generate
#   python -m analysis.random_walk compare
# =============================================================================

# =============================================================================
# Checkpoint Configuration
# =============================================================================
checkpoint:
  # Path to VQ-VAE checkpoint directory
  path: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/model_checkpoints/260110_065324_633695
  # Checkpoint step to load (null = latest)
  step: null

# =============================================================================
# Transition Matrix Location
# =============================================================================
transitions:
  # Directory containing transition_probs.npy from analysis
  dir: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/outputs/analysis/transitions

# =============================================================================
# Output Configuration
# =============================================================================
output:
  # Base directory for generation outputs
  base_dir: /home/jovyan/vast/kaiwen/track-mjx/vqvae_jax/outputs/generation

# =============================================================================
# Code Sequence Sampling Configuration
# =============================================================================
sampling:
  # Sampling strategy: "temperature", "nucleus", "greedy"
  strategy: temperature
  # Temperature for temperature sampling (higher = more random)
  # - T < 1.0: More deterministic, prefers high-probability transitions
  # - T = 1.0: Balanced, samples according to learned probabilities
  # - T > 1.0: More random, explores lower-probability transitions
  temperature: 1.0
  # Top-p for nucleus sampling (only used when strategy=nucleus)
  top_p: 0.9
  # Initial clip index to get starting code from
  initial_clip_idx: 0
  # Random seed
  seed: 42

# =============================================================================
# Hold Duration Configuration
# =============================================================================
holds:
  # Use learned self-transition probabilities for hold durations
  use_learned: true
  # Minimum hold duration per code (frames)
  min_duration: 1
  # Maximum hold duration per code (frames)
  max_duration: 50

# =============================================================================
# Generation Configuration
# =============================================================================
generation:
  # Generation horizon (number of timesteps)
  horizon: 500
  # Torso Z threshold for fall detection
  torso_z_threshold: 0.03

# =============================================================================
# Rendering Configuration
# =============================================================================
render:
  # Whether to render output videos
  enabled: true
  # Camera name for rendering
  camera: close_profile-ghost
  # Video dimensions
  width: 640
  height: 480
  # Frame rate
  fps: 50
  # Code bar height
  code_bar_height: 40

# =============================================================================
# Strategy Comparison Configuration
# =============================================================================
comparison:
  # Number of trials per strategy
  num_trials: 10
  # Horizon for comparison runs
  horizon: 300
  # Strategies to compare
  strategies:
    - name: two_stage_t0.5
      type: two_stage
      temperature: 0.5
    - name: two_stage_t1.0
      type: two_stage
      temperature: 1.0
    - name: two_stage_t2.0
      type: two_stage
      temperature: 2.0
    - name: two_stage_greedy
      type: two_stage
      strategy: greedy
