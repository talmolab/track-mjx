# @package _global_
# =============================================================================
# PPO config for StickImitation (mesh model, 41 DoF)
# =============================================================================
# Mirrors fly.yaml's intention-PPO setup, retuned for the stick-bug mesh
# model. Launched via `python scripts/train.py --config-name=stick/stick-ppo-imitation`.
#
# `# @package _global_` makes hydra merge this YAML at the root namespace
# rather than nesting it under a `stick:` group.
#
# Key differences from DMPO config:
# - PPO uses brax's intention-PPO via scripts/train.py
# - walker_config block is top-level (prepare_config reads cfg.walker_config.walker_name)
# - network_config block for the intention encoder/decoder/critic
# - train_setup block carries PPO hyperparameters
# =============================================================================

env_config:
  env_name: "StickImitation"
  mujoco_impl: "jax"

  # Physics — only 6 floor↔claw pairs, so contact buffers are tiny.
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  naconmax: 32
  njmax: 60
  noslip_iterations: 0

  # Timing
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50

  # Reference clips (1 clip × 100 frames from the STAC fit; multi-clip H5 lands later).
  clip_length: 100
  clip_set: "all"
  reference_length: 5
  reference_stride: 1
  start_frame_range: [0, 44]
  qvel_init: "zeros"
  keep_clips_idx: null

  domain_randomization:
    use_domain_randomization: false
    floor_friction: [0.4, 1.0]
    static_friction_scale: [0.9, 1.1]
    armature_scale: [1.0, 1.05]
    com_jitter: [-0.05, 0.05]
    link_mass_scale: [0.9, 1.1]
    torso_mass_jitter: [-0.02, 0.02]
    qpos0_jitter: [-0.05, 0.05]

  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.4
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0
    bodies_pos:
      exp_scale: 0.25
      weight: 1.0
    end_eff:
      exp_scale: 0.032
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0, 0.1]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  termination_criteria:
    root_too_far:
      max_distance: 0.05
    root_too_rotated:
      max_degrees: 60.0
    pose_error:
      max_l2_error: 4.5
    nan_termination: {}

walker_config:
  walker_name: "stickbug"
  torque_actuators: false             # stick env doesn't support torque-mode conversion
  rescale_factor: 1.0                 # STAC fit was done with SCALE_FACTOR=1

# =============================================================================
# Rendering Configuration
# =============================================================================
render_config:
  render_camera_name: close_profile
  render_fps: 50
  render_interval: 1

# =============================================================================
# Network Architecture (intention encoder-decoder, smaller than rodent)
# =============================================================================
network_config:
  arch_name: intention
  encoder_layer_sizes: [512, 256, 256]
  decoder_layer_sizes: [256, 256, 256]
  critic_layer_sizes: [512, 512, 256]
  intention_size: 32
  proprioception_noise_std: 0.0
  kl_schedule: true
  latent_kl_weight: 3e-2
  latent_ar1_weight: 0.0

# =============================================================================
# Training Setup
# =============================================================================
train_setup:
  agent_name: stickbug
  run_name: stick-ppo

  # Checkpointing and restoration
  checkpoint_to_restore: null
  restore_from_run_state: null

  # Data splitting (1 clip total, so subset ratio doesn't matter)
  train_test_split_info: null
  train_subset_ratio: 1.0

  # Evaluation and resets
  eval_every: 5_000_000
  episode_length: 100
  reset_every: 10_000_000

  # ---------------------------------------------------------------------------
  # PPO Training Hyperparameters
  # ---------------------------------------------------------------------------
  train_config:
    num_envs: 2048
    num_timesteps: 200_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 1e-4
    grad_clip_threshold: 20.0
    clipping_epsilon: 0.2
    discounting: 0.95
    action_repeat: 1
    entropy_cost: 1e-2
    vf_loss_coefficient: 0.25
    reward_scaling: 1
    normalize_observations: true
    unroll_length: 20
    seed: 0
    get_activation: false
    deterministic_eval: true

# =============================================================================
# Logging Configuration
# =============================================================================
logging_config:
  project_name: ppo-stick-imitation
  group_name: stickbug
  exp_name: stick-mesh-ppo
  clip_id: -1
  model_path: model_checkpoints/
