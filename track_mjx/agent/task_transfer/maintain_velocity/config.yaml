# Maintain Velocity Task Transfer Training Config
#
# Three training modes:
#   decoder_only: Freeze decoder, train new encoder
#   prior_decoder: Freeze prior + decoder, train residual encoder
#   scratch: Train both policy and decoder from random initialization
#
# Usage:
#   python -m track_mjx.agent.task_transfer.maintain_velocity.train mode=decoder_only
#   python -m track_mjx.agent.task_transfer.maintain_velocity.train mode=prior_decoder
#   python -m track_mjx.agent.task_transfer.maintain_velocity.train mode=scratch

defaults:
  - _self_

# Training mode: "decoder_only", "prior_decoder", or "scratch"
mode: "decoder_only"

# Checkpoint to load (mlp_prior checkpoint)
checkpoint:
  path: "./model_checkpoints/YYMMDD_HHMMSS"  # Replace with your checkpoint
  step: null  # null = latest

# Mode-specific settings
decoder_only:
  _placeholder: true

prior_decoder:
  deterministic_prior: true
  noise_logvar: -2.0

scratch:
  # No extra config needed for scratch mode - uses network settings below
  _placeholder: true

# Network architecture
network:
  policy_layers: [1024, 512, 256]
  value_layers: [1024, 512, 256]

# Training parameters
train:
  num_timesteps: 2_000_000_000
  episode_length: 2000
  num_envs: 4096
  batch_size: 1024
  num_minibatches: 16
  num_updates_per_batch: 4
  learning_rate: 1e-4
  entropy_cost: 1e-4
  discounting: 0.99
  clipping_epsilon: 0.2
  gae_lambda: 0.95
  max_grad_norm: 50.0
  vf_loss_coefficient: 5.0
  reward_scaling: 1.0
  normalize_observations: true
  unroll_length: 20
  action_repeat: 1
  seed: 0
  eval_every: 15_000_000

# Environment settings
env:
  target_speed: 0.5
  # Reward term weights
  reward_weights:
    forward_velocity: 1.0
    lateral_velocity: 0.5
    angular_velocity_z: 0.1

# Logging settings
logging:
  project: "vnl-playground"
  group_name: "maintain_velocity_transfer"
  exp_name: "maintain_velocity_transfer"
  render_camera: "close_profile-rodent"
  render_fps: 50
  render_height: 480
  render_width: 640
  render_every: 1  # Render video every N evaluation steps (always renders first eval)
