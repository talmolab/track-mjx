[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "track-mjx"
authors = [
    {name = "Charles Zhang", email = "charleszhang@fas.harvard.edu"},
    {name = "Scott Yang", email = "scyang@salk.com"},
    {name = "Talmo Pereira", email = "talmo@salk.edu"}]
description=  "Track-MJX: A Python package for fast reinforcement learning-based imitation learning tracking for agents"
requires-python = ">=3.10,<3.13"
keywords = ["tracking", "imitation learning", "deep learning"]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"]
dependencies = [
    # JAX core (both platforms)
    "jax==0.6.2",
    "jaxlib==0.6.2",
    # JAX CUDA 12 support (Linux only - works with CUDA 13.0)
    "jax-cuda12-plugin==0.6.2 ; sys_platform == 'linux'",
    "jax-cuda12-pjrt==0.6.2 ; sys_platform == 'linux'",
    # Note: macOS uses CPU-only JAX (jax-metal 0.1.1 incompatible with JAX 0.6.2)
    # NVIDIA CUDA libraries (Linux only - required for JAX GPU)
    "nvidia-cublas-cu12>=12.0 ; sys_platform == 'linux'",
    "nvidia-cuda-cupti-cu12>=12.0 ; sys_platform == 'linux'",
    "nvidia-cuda-nvrtc-cu12>=12.0 ; sys_platform == 'linux'",
    "nvidia-cuda-runtime-cu12>=12.0 ; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9.0 ; sys_platform == 'linux'",
    "nvidia-cufft-cu12>=11.0 ; sys_platform == 'linux'",
    "nvidia-cusolver-cu12>=11.0 ; sys_platform == 'linux'",
    "nvidia-cusparse-cu12>=12.0 ; sys_platform == 'linux'",
    # Core ML dependencies
    "brax==0.13.0",
    "flax==0.10.2",
    "optax==0.2.6",
    "orbax-checkpoint",
    # MuJoCo
    "mujoco==3.3.2",
    "mujoco-mjx==3.3.2",
    # Rendering (EGL/osmesa support)
    "PyOpenGL==3.1.9",
    # Data & ML utilities
    "numpy==1.26.4",
    "h5py==3.12.1",
    "numba==0.61.0",
    "scikit-learn==1.7.2",
    # Visualization
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "pandas",
    "mediapy==1.2.2",
    "imageio[ffmpeg]==2.37.0",
    # Config & logging
    "hydra-core==1.3.2",
    "wandb==0.19.5",
    # HuggingFace for model/data downloads
    "huggingface-hub",
    # Other utilities
    "playground==0.0.5",
    "ipykernel",
    ]

dynamic = ["version", "readme"]

[tool.setuptools.dynamic]
version = {attr = "track_mjx.version.__version__"}
readme = {file = ["README.md"], content-type="text/markdown"}

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-watch",
    "black",
    "pydocstyle",
    "toml",
    "twine",
    "build",
    "mkdocs-material[imaging]",
    "mkdocs-jupyter",
    "mkdocstrings[python]>=0.18",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "mike",
    ]

[project.urls]
Repository = "https://github.com/talmolab/track-mjx"

[tool.setuptools.packages.find]
exclude = ["site", "model_checkpoints*", "wandb", "outputs"]

[tool.black]
line-length = 88

[pydocstyle]
convention = "google"
match-dir = "track_mjx"
